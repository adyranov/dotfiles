name: CI Docker
permissions: {}
on:
  workflow_call:
    inputs:
      matrix:
        type: string
        default: '["archlinux","fedora","ubuntu"]'
      publish:
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
  schedule:
    - cron: 0 23 * * 6
  workflow_dispatch:
    inputs:
      publish:
        description: Publish docker images
        required: true
        default: false
        type: boolean
concurrency:
  group: ${{ github.workflow }}-ci-docker-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  docker-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.matrix || '["archlinux","fedora","ubuntu"]') }}
      fail-fast: false
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run container Bats suite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker buildx build \
            --target test \
            --secret id=GIT_AUTH_TOKEN,env=GITHUB_TOKEN \
            -f containers/${{ matrix.os }}/Dockerfile \
            .
      - name: Verify offline zsh and bash container startup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker buildx build \
            --load \
            -t dotfiles-test:${{ matrix.os }} \
            --secret id=GIT_AUTH_TOKEN,env=GITHUB_TOKEN \
            -f containers/${{ matrix.os }}/Dockerfile \
            .
          docker run --rm --network=none dotfiles-test:${{ matrix.os }} \
            zsh -ic '(( ${+_abbr_map[x]} )) && [[ -r "$ZDOTDIR/plugins/zsh-autosuggestions/zsh-autosuggestions.zsh" ]]'
          docker run --rm --network=none dotfiles-test:${{ matrix.os }} \
            bash -ic 'type cdi >/dev/null && alias ll >/dev/null && [[ "$(starship prompt)" == *"container"* ]]'
  docker-build:
    needs: [docker-test]
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.matrix || '["archlinux","fedora","ubuntu"]') }}
      fail-fast: false
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: docker/github-builder/.github/workflows/build.yml@a31d2311da4d55e21b978c1c52bab82ba97d51ee # v1.19.0
    with:
      output: image
      push: ${{ inputs.publish == true || (github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'schedule' && github.workflow == 'CI Docker') }}
      context: .
      file: containers/${{ matrix.os }}/Dockerfile
      platforms: linux/arm64,linux/amd64
      cache: true
      sbom: true
      meta-images: |
        ghcr.io/${{ github.repository }}
        docker.io/${{ github.repository }}
      meta-tags: |
        type=schedule,prefix=${{ matrix.os }}-,pattern={{date 'YYYYMMDD'}}
        type=raw,value=${{ matrix.os }},enable={{is_default_branch}}
        type=ref,event=pr,prefix=${{ matrix.os }}-pr-
      meta-flavor: |
        latest=${{ github.ref_name == 'main' && contains(matrix.os, 'ubuntu') }}
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        - registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
