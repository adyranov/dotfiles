name: Security Scan
permissions: {}
on:
  workflow_run:
    workflows: [CI, CI Docker]
    branches: [main]
    types: [completed]
  workflow_dispatch:
concurrency:
  group: security-scan-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  trivy:
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, fedora, archlinux]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      packages: read
      security-events: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - name: Run Trivy vulnerability scanner
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ matrix.os }}
          scanners: vuln,secret,misconfig
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-results.sarif
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        if: always() && steps.trivy.outcome == 'success'
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.os }}
