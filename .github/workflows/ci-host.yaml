name: CI Host
permissions: {}
on:
  workflow_call:
    inputs:
      matrix:
        type: string
        default: '["ubuntu-24.04","ubuntu-24.04-arm","macos-26","macos-26-intel"]'
      mode:
        type: string
        default: full
  workflow_dispatch:
    inputs:
      matrix:
        description: JSON runner matrix
        required: true
        default: '["ubuntu-24.04","ubuntu-24.04-arm","macos-26","macos-26-intel"]'
        type: string
      mode:
        description: Host validation depth
        required: true
        default: full
        type: choice
        options:
          - smoke
          - full
concurrency:
  group: ${{ github.workflow }}-ci-host-${{ inputs.mode || 'full' }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  host-build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.matrix || '["ubuntu-24.04","ubuntu-24.04-arm","macos-26","macos-26-intel"]') }}
      fail-fast: false
    timeout-minutes: ${{ inputs.mode == 'full' && 60 || 20 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore Homebrew Cache
        if: runner.os == 'macOS'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: restore-homebrew
        with:
          path: |
            ~/Library/Caches/Homebrew/api
            ~/Library/Caches/Homebrew/downloads
          key: host-homebrew-${{ inputs.mode }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('home/.chezmoidata/brew.toml', 'home/.chezmoidata/base/packages/*.toml', 'home/.chezmoidata/os/darwin/**', 'home/.chezmoitemplates/base/packages/**', 'home/.chezmoitemplates/os/darwin/**', 'home/private_dot_config/exact_brew/**') }}
          restore-keys: host-homebrew-${{ inputs.mode }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore mise Cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: restore-mise
        with:
          path: |
            ~/.local/share/mise/downloads
            ~/.local/share/uv-cache
          key: host-mise-${{ inputs.mode }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml', 'home/.chezmoidata/*.toml', 'home/.chezmoidata/base/packages/**', 'home/.chezmoidata/os/**/packages.toml', 'home/.chezmoitemplates/base/packages/**', 'home/.chezmoiscripts/common/run_onchange_after_10_install-mise-packages.sh.tmpl') }}
          restore-keys: host-mise-${{ inputs.mode }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore Helm Cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: restore-helm
        with:
          path: ~/.local/share/helm/plugins
          key: host-helm-${{ inputs.mode }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('home/.chezmoidata/base/packages/kubernetes.toml', 'home/.chezmoidata/os/**/packages.toml', 'home/.chezmoitemplates/base/packages/**', 'home/.chezmoiscripts/common/run_onchange_after_20_install-helm-plugins.sh.tmpl') }}
          restore-keys: host-helm-${{ inputs.mode }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Smoke install and test
        if: inputs.mode == 'smoke'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          MISE_ALWAYS_KEEP_DOWNLOAD: true
          MISE_FETCH_REMOTE_VERSIONS_TIMEOUT: 60
          MISE_HTTP_TIMEOUT: 60
        run: |
          WITHOUT_TOOLCHAINS=true ./install.sh --data=false
          zsh -lic 'mise trust && mise run test'
      - name: Full install and test
        if: inputs.mode == 'full'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          MISE_ALWAYS_KEEP_DOWNLOAD: true
          MISE_FETCH_REMOTE_VERSIONS_TIMEOUT: 60
          MISE_HTTP_TIMEOUT: 60
        run: |
          # Install core packages only
          WITHOUT_TOOLCHAINS=true ./install.sh --data=false
          zsh -lic 'mise trust && mise run test -- tests/config.bats'
          # Re-apply with all toolchains enabled
          ./install.sh
          zsh -lic 'CHECK_DOTFILES_SUITE_TIMEOUT=240 mise run test'
      - name: Save Homebrew Cache
        if: success() && github.event_name != 'pull_request' && runner.os == 'macOS' && steps.restore-homebrew.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/Homebrew/api
            ~/Library/Caches/Homebrew/downloads
          key: ${{ steps.restore-homebrew.outputs.cache-primary-key }}
      - name: Save mise Cache
        if: success() && github.event_name != 'pull_request' && steps.restore-mise.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/mise/downloads
            ~/.local/share/uv-cache
          key: ${{ steps.restore-mise.outputs.cache-primary-key }}
      - name: Save Helm Cache
        if: success() && github.event_name != 'pull_request' && steps.restore-helm.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/helm/plugins
          key: ${{ steps.restore-helm.outputs.cache-primary-key }}
