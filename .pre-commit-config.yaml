default_install_hook_types:
  - pre-commit
  - commit-msg
default_stages:
  - pre-commit
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        name: Check Added Large Files
      - id: check-case-conflict
        name: Check Case Conflict
      - id: check-executables-have-shebangs
        name: Check Executables Have Shebangs
        exclude: .*\.tmpl
      - id: check-illegal-windows-names
        name: Check Illegal Windows Names
      - id: check-merge-conflict
        name: Check Merge Conflict
      - id: check-shebang-scripts-are-executable
        name: Check Shebang Scripts Are Executable
        exclude: .*\.tmpl
      - id: check-symlinks
        name: Check Symlinks
      - id: check-toml
        name: Check TOML
        # chezmoi modify_* scripts (chezmoi:modify-template); not valid TOML until rendered
        exclude: modify_.*\.toml$
      - id: check-xml
        name: Check XML
      - id: end-of-file-fixer
        name: Fix End of Files
        exclude: ^\.vscode/
      - id: fix-byte-order-marker
        name: Fix UTF-8 BOM
      - id: pretty-format-json
        name: Format JSON
        args: [--autofix, --no-sort-keys]
        # chezmoi templates: modify_* scripts and .chezmoitemplates are not valid JSON
        exclude: (modify_.*\.json(\.tmpl)?|\.chezmoitemplates/.*)$
      - id: trailing-whitespace
        name: Trim Trailing Whitespace
        exclude: .*\.md.tmpl$
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: Lint GitHub Actions Workflows
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
        name: Format YAML
        types: [yaml]
        exclude: modify_.*\.ya?ml$
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: Lint YAML
        exclude: modify_.*\.ya?ml$
  - repo: https://github.com/pappasam/toml-sort
    rev: v0.26.0
    hooks:
      - id: toml-sort-fix
        name: Sort TOML
        args: [--in-place]
        exclude: modify_.*\.toml$
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        name: Format Shell Scripts
        args: ["-w", "-s", "-i", "2"]
        exclude: .*\.tmpl|.*\.bats|\.chezmoitemplates/
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        name: Lint Shell Scripts
        exclude: .*\.tmpl|.*\.bats|\.chezmoitemplates/|dot_p10k\.zsh
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: Detect Hardcoded Secrets
  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v4.0.2
    hooks:
      - id: editorconfig-checker
        name: Check EditorConfig
        exclude: \.(plist|tmpl|pub|age)$
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.257.5
    hooks:
      - id: renovate-config-validator
        name: Validate Renovate Config
  - repo: https://github.com/crate-ci/typos
    rev: v1.52.2
    hooks:
      - id: typos
        name: Check Spelling
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.2
    hooks:
      - id: markdownlint-cli2
        name: Lint Markdown
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        name: Validate Conventional Commit Message
        stages: [commit-msg]
        pass_filenames: true
  - repo: local
    hooks:
      - id: chezmoi-execute-template
        name: Validate Chezmoi Templates
        entry: sh -c 'rc=0; for f in "$@"; do if ! chezmoi --source . execute-template < "$f" > /dev/null; then printf "failed template %s\n" "$f" >&2; rc=1; fi; done; exit "$rc"' --
        language: system
        files: (\.tmpl$|modify_.*\.(json|toml|ya?ml)(\.tmpl)?$|modify_private_config$)
        exclude: \.chezmoi\.yaml\.tmpl$
        stages: [pre-commit]
      - id: node-syntax-check
        name: Check JS/MJS Syntax
        entry: sh -c 'rc=0; for f in "$@"; do if ! node --check "$f"; then printf "failed JS syntax %s\n" "$f" >&2; rc=1; fi; done; exit "$rc"' --
        language: system
        files: ^home/private_dot_config/exact_dcg/.*\.(mjs|js)$
        stages: [pre-commit]
      - id: zsh-syntax-check
        name: Check Zsh Functions Syntax
        entry: sh -c 'rc=0; for f in "$@"; do if ! zsh -n "$f"; then printf "failed zsh syntax %s\n" "$f" >&2; rc=1; fi; done; exit "$rc"' --
        language: system
        files: ^home/private_dot_config/exact_zsh/exact_functions\.d/
        stages: [pre-commit]
      # The config template only renders under --init; stdin is not a TTY,
      # so the prompts take their defaults.
      - id: chezmoi-init-template
        name: Validate Chezmoi Config Template
        # --source: CI has no chezmoi config, and a worktree must validate itself.
        entry: sh -c 'chezmoi --source . execute-template --init --file home/.chezmoi.yaml.tmpl </dev/null >/dev/null'
        language: system
        files: ^home/(\.chezmoi\.yaml\.tmpl|\.chezmoitemplates/base/helpers/)
        pass_filenames: false
        stages: [pre-commit]
      - id: docs-tools
        name: Check README tools table
        entry: .mise/tasks/docs-tools --check
        language: system
        files: ^(home/\.chezmoidata/|home/\.chezmoitemplates/base/packages/|home/\.chezmoitemplates/os/darwin/brewfile$|README\.md$|\.mise/tasks/docs-tools$)
        pass_filenames: false
        stages: [pre-commit]
default_language_version:
  node: system
  python: python3.15
exclude: |
  (?x)^(
    node_modules/.*|
    .*/__pycache__/.*
  )$
