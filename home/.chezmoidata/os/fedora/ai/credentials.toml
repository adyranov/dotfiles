# Non-enforcing host (KTD5): Landlock denies cover only paths existing at
# sandbox start and the proxy is not enforced per-port, so scrub-only here is
# a provider blackout. The delegated subset is the exported provider keys:
# the routed provider names join env_injected, so their real values pass
# through into the agent env, redacted via diagnostics.redaction.extra_env_vars.
# GITHUB_TOKEN/GH_TOKEN stay in the base secrets list: GitHub is not
# delegated on this host.
# Data merge: env_injected is a table, so the deep merge ADDS these keys to
# the base rows; arrays are REPLACED, so the overlay carries no secrets array —
# the base list stays the derived set (render-credentials subtracts the
# env_injected names from the rendered deny_vars; a trimmed array here would
# fail the env_injected membership check). routes_enabled stays false (base
# default): routes render nothing on this host.
[ai.os.fedora.credentials]
env_injected = { ANTHROPIC_API_KEY = "non-enforcing host: the proxy injects nothing here, the exported key passes through (KTD5)", OPENAI_API_KEY = "non-enforcing host: the proxy injects nothing here, the exported key passes through (KTD5)" }
