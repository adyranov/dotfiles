# Non-enforcing host: Landlock denies cover only paths existing at sandbox start
# and the proxy is not per-port enforced, so scrub-only is a provider blackout —
# the exported provider keys pass through via env_injected (GITHUB_TOKEN/GH_TOKEN
# stay non-delegated). env_injected deep-merges; arrays are replaced, so the base
# secrets list stays the derived set (render-credentials subtracts env_injected
# names). routes_enabled stays false: routes render nothing here.
[ai.os.fedora.credentials]
env_injected = { ANTHROPIC_API_KEY = "non-enforcing host: the proxy injects nothing here, the exported key passes through", OPENAI_API_KEY = "non-enforcing host: the proxy injects nothing here, the exported key passes through" }
