[packages.os.fedora.core]
difftastic = { manager = "system" }
libatomic = { package = "libatomic", test = "rpm -q libatomic" }
openssh-client = { package = "openssh-clients" }
"pcsc-lite" = { package = "pcsc-lite", test = "rpm -q pcsc-lite" }

[packages.os.fedora.docker]
docker = { exclude = { type = ["wsl"] }, package = "docker-ce" }
"docker-buildx" = { exclude = { type = ["wsl"] }, package = "docker-buildx-plugin" }
"docker-compose" = { exclude = { type = ["wsl"] }, package = "docker-compose-plugin" }

[packages.os.fedora.kubernetes]
oc = { exclude = { arch = ["arm64"] } }
