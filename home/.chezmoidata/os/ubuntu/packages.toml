[packages.os.ubuntu.core]
libatomic1 = { package = "libatomic1", test = "dpkg -s libatomic1" }
pcscd = { description = "PC/SC smart card daemon", name = "pcscd", url = "https://pcsclite.apdu.fr", package = "pcscd", test = "dpkg -s pcscd" }
wslu = { bin = "wslview", description = "WSL integration utilities", name = "wslu", url = "https://wslutiliti.es/wslu", include = { type = ["wsl"] }, version = "wslview --version" }

[packages.os.ubuntu.docker]
docker = { exclude = { type = ["wsl"] }, package = "docker-ce" }
"docker-buildx" = { exclude = { type = ["wsl"] }, package = "docker-buildx-plugin" }
"docker-compose" = { exclude = { type = ["wsl"] }, package = "docker-compose-plugin" }

[packages.os.ubuntu.kubernetes]
oc = { exclude = { arch = ["arm64"] } }
