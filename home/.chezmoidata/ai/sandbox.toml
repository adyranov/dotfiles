# Credential routes (nono network.custom_credentials, keys 1:1). The proxy
# reads the real value from the launching environment (credential_key) and the
# agent sees only a phantom in env_var. `agents` scopes each route. Only
# providers a profile uses get a route: Claude logs in via the keychain and
# openai-codex via the agent's ChatGPT OAuth file, so neither has one
# (ANTHROPIC_API_KEY, CLAUDE_CODE_OAUTH_TOKEN, OPENAI_API_KEY stay denied).
[ai.sandbox.credentials.brave]
# pi-web-access and omp read BRAVE_API_KEY, so the phantom lands there.
agents = ["omp", "opencode", "pi"]
credential_format = "{}"
credential_key = "env://BRAVE_SEARCH_API_KEY"
env_var = "BRAVE_API_KEY"
inject_header = "X-Subscription-Token"
upstream = "https://api.search.brave.com"

[ai.sandbox.credentials.deepseek]
agents = ["omp", "opencode", "pi"]
credential_format = "Bearer {}"
credential_key = "env://DEEPSEEK_API_KEY"
env_var = "DEEPSEEK_API_KEY"
inject_header = "authorization"
upstream = "https://api.deepseek.com"

[ai.sandbox.credentials.github]
# gh reads GH_TOKEN before GITHUB_TOKEN, so the phantom lands in GH_TOKEN.
agents = ["claude", "omp", "opencode", "pi"]
credential_format = "Bearer {}"
credential_key = "env://GITHUB_TOKEN"
env_var = "GH_TOKEN"
inject_header = "authorization"
upstream = "https://api.github.com"

[ai.sandbox.credentials.github_git]
# nono basic_auth injects one fixed user:password (nolabs-ai/nono#2090) but GitHub
# git wants x-access-token:<token>, so the launcher derives GITHUB_GIT_CREDENTIAL.
# In the sandbox git gets the phantom GH_TOKEN via the `!gh auth git-credential`
# helper. Branch protection comes from GitHub rulesets, not this proxy.
agents = ["claude", "omp", "opencode", "pi"]
credential_key = "env://GITHUB_GIT_CREDENTIAL"
inject_mode = "basic_auth"
upstream = "https://github.com"

[[ai.sandbox.credentials.github_git.endpoint_rules]]
method = "GET"
path = "/**"

[[ai.sandbox.credentials.github_git.endpoint_rules]]
method = "POST"
path = "/*/*/git-upload-pack"

[[ai.sandbox.credentials.github_git.endpoint_rules]]
method = "POST"
path = "/*/*/git-receive-pack"

[ai.sandbox.credentials.opencode]
# Zen and Go serve these models OpenAI-style: clients send Authorization: Bearer.
agents = ["omp", "opencode", "pi"]
credential_format = "Bearer {}"
credential_key = "env://OPENCODE_API_KEY"
env_var = "OPENCODE_API_KEY"
inject_header = "authorization"
upstream = "https://opencode.ai"

[ai.sandbox.credentials.openrouter]
agents = ["omp", "opencode", "pi"]
credential_format = "Bearer {}"
credential_key = "env://OPENROUTER_API_KEY"
env_var = "OPENROUTER_API_KEY"
inject_header = "authorization"
upstream = "https://openrouter.ai"

[ai.sandbox.set_vars]
# Skip /etc/gitconfig (unreadable under Linux Landlock) and isolate caches under ~/.cache.
GIT_CONFIG_NOSYSTEM = "1"
NPM_CONFIG_CACHE = "~/.cache/sandbox-npm"
PREK_HOME = "~/.cache/sandbox-prek"
UV_CACHE_DIR = "~/.cache/sandbox-uv"
