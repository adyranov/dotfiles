# Agent sandbox data (nono). Each agent profile extends its upstream signed
# pack (`nono pull <pack>`) plus the built-in profiles in `extends`; this file
# holds only the overlay: egress allowlist, credential routes, env deny
# globs, and the per-agent paths this repo relocates. Plain TOML only.

[ai.sandbox]
# Env deny globs removed from every agent environment (nono environment.deny_vars,
# matched case-insensitively). Route phantoms survive: nono injects credentials
# after env filtering, so these globs never strip them.
case_insensitive_vars = true
deny_vars = [
  "*CREDENTIAL*",
  "*PASSWD*",
  "*PASSWORD*",
  "*SECRET*",
  "*_KEY",
  "*_TOKEN",
  "AWS_*",
  "AZURE_*",
  "BW_*",
  "BWS_*",
  "CLAUDE_CODE_SAFE_MODE",
  "CLAUDE_CODE_SIMPLE",
  "DCG_*",
  "OP_*",
  "PROTON_PASS_*",
  "SSH_AUTH_SOCK",
  "VAULT_*"
]
# Password-manager CLI state nono's deny_credentials group does not cover
# (macOS only: Landlock cannot deny; these dirs are never granted on Linux).
deny = [
  "~/.config/Bitwarden CLI",
  "~/.config/bws",
  "~/.config/proton-pass-cli",
  "~/.local/share/proton-pass-cli",
  "~/Library/Application Support/Bitwarden CLI",
  "~/Library/Application Support/proton-pass-cli"
]
# Built-in nono profiles every agent profile extends after its pack.
extends = ["mise-dev"]
# Shared directories every agent may read: git's empty init.templateDir.
read = ["~/.config/git/hooks-template"]
# Files every agent may read (nono filesystem.read_file). Git's global-config
# include chain: an unreadable include is fatal for git, not a skip. Listed per
# file so ~/.config/git/credentials stays hidden; missing files are harmless.
# gh refuses to start without config.yml and hosts.yml; neither holds the
# token (Keychain on the host, the GH_TOKEN phantom in the sandbox).
read_file = [
  "~/.config/certificates/ca-bundle.pem",
  "~/.config/gh/config.yml",
  "~/.config/gh/hosts.yml",
  "~/.config/git/base",
  "~/.config/git/catppuccin.gitconfig",
  "~/.config/git/color",
  "~/.config/git/config",
  "~/.config/git/diff",
  "~/.config/git/ignore",
  "~/.config/git/local",
  "~/.config/git/tools",
  "~/.config/git/user",
  "~/.config/git/work",
  "~/.config/git/work-user",
  "~/.gitconfig",
  "~/.local/share/java/truststore.jks"
]
# Localhost TCP ports reachable past the proxy: the engram daemon. The local
# model gateway port is added from ai.serving.local.port at render.
open_port = [7437]

# Per-agent overlay: the upstream pack plus read/write paths for the dirs this
# repo relocates (XDG config dirs, engram, codegraph). A
# leading `~/` expands to the home directory at render.
# The dcg read grants keep the guard hook on custom packs and user approvals
# instead of falling back to the 3 default packs; both upstream config homes
# are granted (the macOS Application Support one is a no-op rule where it does
# not exist).
[ai.sandbox.agents.claude]
allow = [
  "~/.codegraph",
  "~/.config/ponytail/band",
  "~/.local/share/claude/plugins/data",
  "~/.local/share/engram",
  "~/.local/state/claude"
]
# Claude locks its config dir via a sibling file; the pack only grants the
# default ~/.claude.lock, not the relocated ~/.config/claude.lock.
allow_file = ["~/.config/claude.lock"]
pack = "nolabs-ai/claude"
read = ["~/.config/agents", "~/.config/claude-powerline", "~/.config/dcg", "~/.config/ponytail", "~/.local/share/claude", "~/Library/Application Support/dcg"]

[ai.sandbox.agents.omp]
allow = [
  "~/.cache/omp",
  "~/.codegraph",
  "~/.local/share/engram",
  "~/.local/share/omp",
  "~/.local/state/omp"
]
deny = ["~/.claude", "~/.claude.json", "~/.config/claude", "~/.config/claude/.claude.json"]
pack = "nolabs-ai/omp"
read = ["~/.config/agents", "~/.config/dcg", "~/Library/Application Support/dcg"]

[ai.sandbox.agents.opencode]
allow = [
  "~/.cache/opencode",
  "~/.codegraph",
  "~/.config/ponytail/band",
  "~/.local/share/engram",
  "~/.local/share/opencode",
  "~/.local/state/opencode"
]
deny = ["~/.claude", "~/.claude.json", "~/.config/claude", "~/.config/claude/.claude.json"]
pack = "nolabs-ai/opencode"
read = ["~/.config/agents", "~/.config/dcg", "~/.config/ponytail", "~/Library/Application Support/dcg"]

[ai.sandbox.agents.pi]
allow = [
  "~/.cache/pi",
  "~/.codegraph",
  "~/.config/ponytail/band",
  "~/.config/rpiv-todo",
  "~/.local/share/engram",
  "~/.pi-lens"
]
deny = ["~/.claude", "~/.claude.json", "~/.config/claude", "~/.config/claude/.claude.json"]
pack = "nolabs-ai/pi"
read = ["~/.config/agents", "~/.config/dcg", "~/.config/ponytail", "~/Library/Application Support/dcg"]

