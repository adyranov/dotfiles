# Narrow dedicated host groups for the command sandboxes (resolved by
# expand-path-groups with catalog "ai.permissions.network.groups"). Sandbox
# lists reference ONLY these groups, never a base category: mediated sandboxes
# get egress solely for what their own list grants, so a base-category
# reference would widen them. Dotless entries in any network list are group
# references here and loud-fail at render when absent.
[ai.base.permissions.network.groups]
# Git is HTTPS-only: exactly the GitHub transport hosts (api.github.com is
# deliberately absent — it is not transport).
git_forge = ["*.githubusercontent.com", "codeload.github.com", "github.com"]
# mise's own registry hosts plus the node runtime pair (mise install node).
mise_runtime = [
  "*.crates.io",
  "*.golang.org",
  "*.jdx.dev",
  "*.nodejs.org",
  "*.npmjs.org",
  "*.pythonhosted.org",
  "api.github.com",
  "cdn.jsdelivr.net",
  "nodejs.org",
  "pypi.org",
  "static.rust-lang.org"
]

[ai.base.permissions.network.localhost]
# 7437 = engram daemon (base-wide relay); the local serving port is appended
# by render-nono-net. 49374 (0xc0de, opencode v2 service) is NOT base-wide:
# a host-side relay's reach shrinks when only its owning agent forwards it —
# it rides agents/opencode.toml's sandbox.network.forward_ports.
forward_ports = [7437]
