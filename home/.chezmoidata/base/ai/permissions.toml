  # shell / REPL / CLI history
  "~/.bash_history",
  "~/.zsh_history",
  "~/.history",
  "~/.local/state/bash/history",
  "~/.local/state/zsh/history",
  "~/.local/share/atuin/**",
  "~/.psql_history",
  "~/.mysql_history",
  "~/.mongosh_history",
  "~/.rediscli_history",
  "~/.sqlite_history",
  "~/.lesshst",
  # AI agent persistent memory (accessed via MCP, not direct file tools)
  "~/.local/share/engram",
  "~/.local/share/engram/**"
]

# Level 3 — System-wide command deny list
[ai.base.permissions.commands]
deny = [
  # privilege escalation
  "sudo *",
  "doas *",
  "su *",
  "su",
  # system power
  "shutdown *",
  "reboot *",
  "halt *",
  "poweroff *",
  # service management
  "systemctl stop *",
  "systemctl disable *",
  "systemctl mask *",
  "systemctl daemon-reload *",
  "launchctl unload *",
  "launchctl remove *",
  "launchctl bootout *",
  # scheduled tasks
  "crontab -e *",
  "crontab -r *",
  # in-place file mutation
  "sed -i *",
  "sed * -i *",
  # macOS keychain
  "security delete-*",
  "security add-*",
  "security set-*",
  "security unlock-keychain *",
  "security dump-keychain *",
  "security find-generic-password*",
  "security find-internet-password*",
  # system package managers (removal)
  "brew uninstall *",
  "brew remove *",
  "brew untap *",
  "apt remove *",
  "apt purge *",
  "apt-get remove *",
  "apt-get purge *",
  "dnf remove *",
  "pacman -R*",
  "snap remove *",
  # network exfiltration tools
  "nc *",
  "ncat *",
  "netcat *",
  "socat *",
  # credential extraction
  "gpg --export-secret*",
  # process kill
  "kill -9 *",
  "killall *",
  "pkill *",
  # arbitrary execution wrappers
  "eval *",
  "exec *",
  # user/group management
  "useradd *",
  "userdel *",
  "usermod *",
  "groupadd *",
  "groupdel *",
  # mount/umount
  "mount *",
  "umount *",
  # disk / partition / swap
  "mkfs *",
  "diskutil erase*",
  "diskutil partition*",
  "swapon *",
  "swapoff *",
  "fdisk *",
  "parted *",
  # firewall / network policy
  "iptables *",
  "ip6tables *",
  "nft *",
  "pfctl *",
  "ufw *"
]

