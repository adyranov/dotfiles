# Level 1 — Process boundary (greywall sandbox)
# Paths and caches that every sandboxed agent process needs.
# deny_read/deny_write override allows.

# Level 2 — Agent restrictions (what the AI model cannot access via tools)
# Uses allow/ask/deny categories. This layer stays broad because agent tools can
# expose sensitive files directly. Per-agent auth files live in per-agent sections.
[ai.base.permissions.agent]
allow = []
ask = []
deny_paths = [
  "project_secrets",
  "private_key_files",
  "cert_key_binaries",
  "ssh_broad",
  "gpg_broad",
  "password_stores",
  "cloud_creds",
  "cloud_creds_broad",
  "git_gh_creds",
  "git_gh_creds_broad",
  "package_creds",
  "package_creds_broad",
  "service_creds",
  "service_creds_broad",
  "ai_provider_creds",
  "ai_provider_creds_broad",
  "db_client_secrets",
  "shell_history",
  "secrets_dirs",
  "terraform_state",
  "macos_keychain",
  "engram_memory"
]

# Level 3 — System-wide command deny list
[ai.base.permissions.commands]
deny = [
  "sudo *",
  "doas *",
  "su *",
  "su",
  "shutdown *",
  "reboot *",
  "halt *",
  "poweroff *",
  "systemctl stop *",
  "systemctl disable *",
  "systemctl mask *",
  "systemctl daemon-reload *",
  "launchctl unload *",
  "launchctl remove *",
  "launchctl bootout *",
  "crontab -e *",
  "crontab -r *",
  "sed -i *",
  "sed * -i *",
  "security delete-*",
  "security add-*",
  "security set-*",
  "security unlock-keychain *",
  "security dump-keychain *",
  "security find-generic-password*",
  "security find-internet-password*",
  "brew uninstall *",
  "brew remove *",
  "brew untap *",
  "apt remove *",
  "apt purge *",
  "apt-get remove *",
  "apt-get purge *",
  "dnf remove *",
  "pacman -R*",
  "snap remove *",
  "nc *",
  "ncat *",
  "netcat *",
  "socat *",
  "gpg --export-secret*",
  "kill -9 *",
  "killall *",
  "pkill *",
  "eval *",
  "exec *",
  "useradd *",
  "userdel *",
  "usermod *",
  "groupadd *",
  "groupdel *",
  "mount *",
  "umount *",
  "mkfs *",
  "diskutil erase*",
  "diskutil partition*",
  "swapon *",
  "swapoff *",
  "fdisk *",
  "parted *",
  "iptables *",
  "ip6tables *",
  "nft *",
  "pfctl *",
  "ufw *"
]

