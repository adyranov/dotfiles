# Level 1 — Process boundary (greywall sandbox)
# Paths and caches that every sandboxed agent process needs.
# deny_read/deny_write override allows.

# Level 2 — Agent restrictions (what the AI model cannot access via tools)
# Uses allow/ask/deny categories. This layer stays broad because agent tools can
# expose sensitive files directly. Per-agent auth files live in per-agent sections.
[ai.base.permissions.agent]
allow = []
ask = []
deny = [
  # repo / worktree secrets
  "**/.env",
  "**/.env.*",
  "**/.envrc.local",
  "**/.envrc.private",
  "**/.envrc.secret",
  "**/.direnv/**",
  "**/.htpasswd",
  "**/*-key.pem",
  "**/*_rsa",
  "**/*_rsa.pub",
  "**/*_ed25519",
  "**/*_ed25519.pub",
  "**/*id_rsa*",
  "**/*id_ed25519*",
  "**/key.pem",
  "**/private*.pem",
  "**/*.asc",
  "**/*.key",
  "**/*.p8",
  "**/*.p12",
  "**/*.pfx",
  "**/*.jks",
  "**/*.keystore",
  "**/*.kdbx",
  "**/*.tfstate",
  "**/*.tfstate.*",
  "**/*.tfvars",
  "**/*.tfvars.json",
  "**/.terraform/**",
  "**/*kubeconfig*",
  "**/secrets/**",
  "**/.secrets/**",
  "**/credentials/**",
  "**/.credentials/**",
  # macOS
  "~/Library/Keychains/**",
  # identity / crypto
  "~/.ssh/**",
  "~/.config/ssh/**",
  "~/.gnupg/**",
  "~/.local/share/gnupg/**",
  "~/.password-store/**",
  "~/.local/share/pass/**",
