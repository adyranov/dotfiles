# Nono sandbox permission data. Keys mirror the rendered nono profile sections
# 1:1 (filesystem / command_policies / network / environment via credentials.toml).
# Chezmoi-side sugar, flattened at render: read/write/deny list path-group
# names expanded by expand-path-groups from filesystem.paths (each glob
# defined exactly once); allow_domain groups category -> hosts. Home-anchored
# denies covered by nono's built-in groups are pruned; **/ globs survive.
# This is the only command-deny store (DCG owns the destructive-but-normal set).

# In-sandbox targeted `chezmoi apply` allowlist; the list *is* the grant set:
# session write grants (render-nono-fs, file-granular) plus chezmoi's
# command-sandbox lists (render-nono-cmd, destination-PARENT-dir granular —
# nono accepts only DIRECTORIES there; a file entry policy-denies the whole
# invocation). apply-dest-guard refuses globs, relative paths, and entries
# equal to, an ancestor of, or a descendant of a protected root. Widening is
# the user's audit-loop data edit plus a terminal apply.
[ai.base.permissions.apply]
# The command sandbox replaces the session filesystem grants for chezmoi:
# read = state/cache + source dir + destination PARENT dirs; write = state +
# cache + parents (file-granular containment stays in the session tier).
# Broad parents are refused at render: they re-open the credential deny
# groups under them (`~/.config`: gh hosts.yml, git credentials, configstore,
# pgpass; `~/.local/share`: amazon/azure/engram state).
command_sandbox_read = [
  ".",
  "/dev",
  # PATH resolves chezmoi (and the render chain's tools) through mise shims:
  # shim version resolution scans installs/<tool>/latest (children of the
  # literal dir grant — the /** glob is required); the python3 guard fork
  # writes os_log (/Library/Preferences/Logging). Device nodes ride
  # command_sandbox_read_file below.
  "/Library/Preferences/Logging",
  "~/.cache/chezmoi",
  "~/.config/chezmoi",
  "~/.local/share/chezmoi",
  "~/.local/share/mise/installs",
  "~/.local/share/mise/installs/**"
]
command_sandbox_read_file = ["/dev/autofs_nowait", "/dev/dtracehelper"]
command_sandbox_write = ["~/.cache/chezmoi", "~/.config/chezmoi"]
# Empty by design: every seed is content the USER's unsandboxed tooling
# executes next (git aliases/hooksPath, mise [tasks]/env) — a write path from
# the agent into the user's exec surface. Adding one is a per-path user
# decision, never a default.
destinations = []

# The shared dotfiles profile's curated seed set: carried ONLY by the dotfiles
# nono profile (user-launched dotfiles sessions, any agent), never by the base
# list above, so every project launch keeps zero apply destinations. Every
# entry passes apply-dest-guard; no parent is `~` (a home-root destination
# would put `~` into the chezmoi command sandbox and re-open every credential
# leaf) and no parent holds a deny leaf. The VS Code/Cursor settings pair is
# the PRE-EXISTING App-Support exec surface (sandbox_macos already session-
# grants it) — seeding adds no escalation. Ghostty stays out permanently: its
# `command` option replaces the program for every new terminal surface.
# Empty = unmanaged: an empty list renders a dotfiles profile with zero apply
# surface. Widening stays the user's audit-loop data edit plus terminal apply.
[ai.base.permissions.apply.dotfiles]
destinations = [
  "~/.config/atuin/config.toml",
  "~/.config/bat/config",
  "~/.config/btop/btop.conf",
  "~/.config/fd/ignore",
  "~/.config/rpiv-ask-user-question/config.json",
  "~/.config/rpiv-todo/config.json",
  "~/.config/wget/wgetrc",
  "~/Library/Application Support/Code/User/keybindings.json",
  "~/Library/Application Support/Code/User/settings.json",
  "~/Library/Application Support/Cursor/User/keybindings.json",
  "~/Library/Application Support/Cursor/User/settings.json"
]

# Per-command command-sandbox overrides keyed by command name (unlisted names
# keep the default ["."]). The ["."] default is fatal for git (dies reading
# ~/.config/git/config; cannot write worktrees, hook caches, TMPDIR) and mise
# (cannot exec its own binary). apply-dest-guard validates every list.
[ai.base.permissions.apply.sandbox.git]
# Empirically tested (nono 0.79.0, macOS): `git status` rc 0 from the repo
# cwd; re-run that probe in the user terminal after touching this list.
# `@git:config-files` is NOT usable: it expands to FILE entries and the lists
# are directories-only. The config chain rides fs_read_file per-file: a
# `~/.config/git` dir grant would re-open ~/.config/git/credentials (the
# command sandbox REPLACES the session tier and nono 0.79's built-in
# deny_credentials does not cover that path); /opt/local is the MacPorts git
# install; /dev and /Library/Preferences/Logging (os_log) are macOS binary
# reads. `/System/Volumes/Data` stays OUT: as the APFS firmlink root for every
# home path, a dir grant there makes the whole home — incl. credentials —
# readable through the firmlink view, re-opening that floor.
fs_read = [
  ".",
  "core_unix",
  "agents_scratch",
  "/opt/local",
  "/Library/Developer/CommandLineTools",
  "~/.cache/pre-commit",
  "~/.local/share/chezmoi",
  "~/.local/share/mise",
  # v2 snapshot capture runs through this mediated git.
  "~/.local/share/opencode/snapshot"
]
# TMPDIR: git hooks/pre-commit write temp files; denial is fatal. `$TMPDIR` is
# a sentinel expanded at render time (expand-tmpdir); data is static TOML.
fs_write = [
  "tmp_workspace",
  "agents_scratch",
  "/private/var/folders",
  "~/.cache/pre-commit",
  "~/.local/share/opencode/snapshot"
]
# Every macOS binary writes the dtrace probe device; denial is fatal.
fs_write_file = ["dtrace_helper_file"]
# The session exports GIT_SSL_CAINFO at the house bundle and the command sandbox
# replaces the session grants: ungranted, every HTTPS op dies with
# "error setting certificate verify locations" (measured, nono 0.79.0).
# The git config chain rides the per-file key (system config is under
# /private/etc, in core_unix). Credentials are deliberately absent: the
# command sandbox is default-deny, so the store stays unreachable by omission
# (render-nono-cmd has no fs_deny pass-through; mirror git_gh_creds only if
# nono ever grants credential paths by default).
fs_read_file = [
  "~/.config/git/config",
  "~/.config/git/ignore",
  "~/.gitconfig",
  "ca_bundle"
]
# The macOS child-exec gate takes literal canonical paths only (no globs) and
# drops exec_paths, so git-core helpers and hooks (run via /bin/sh) need
# explicit seatbelt rules, emitted AFTER the exec-gate deny so last-match
# wins; honoured only in user-authored profiles — this one is.
unsafe_macos_seatbelt_rules = [
  "(allow process-exec* (literal \"/opt/local/libexec/git-core/git\"))",
  "(allow process-exec* (literal \"/bin/sh\"))",
  # Darwin git rewrites the hook shebang /bin/sh to DEFAULT_SHELL_PATH=/bin/bash.
  "(allow process-exec* (literal \"/bin/bash\"))",
  "(allow process-exec* (subpath \"/Library/Developer/CommandLineTools/usr/libexec/git-core\"))",
  # find_hook() gates hooks on access(path, X_OK), which seatbelt checks as
  # process-exec* (there is NO file-test-execute operation; that symbol breaks
  # sandbox_init), so git silently skips hooks under /private/tmp/agents without
  # this grant. No new authority: the dir is already fs_write-granted.
  "(allow process-exec* (subpath \"/private/tmp/agents\"))"
]
# Linux parity for the same nested exec: exec_paths dirs, dropped on macOS.
exec_paths = ["/opt/local/libexec/git-core", "/usr/lib/git-core"]

# Mediation gives a sandboxed command proxy egress only for hosts its own
# sandbox grants; the session allow-list does not apply. Git is HTTPS-only, so
# fetch/clone egress is exactly the GitHub transport hosts.
[ai.base.permissions.apply.sandbox.git.network]
allow_domain = ["git_forge"]

[ai.base.permissions.apply.sandbox.mise]
# mise's ~/.local/bin entry point is a symlink-to-file; a dir entry cannot carry it.
# Chained mediation: mise-exec'd children need the caller's can_use edge (no
# fallback) — adopted from 157 audited denies of `mise npm` (pi plugin update
# check); nono-cmd-policy lifts it to the command entry. /dev (autofs) and
# /Library/Preferences/Logging (os_log) carry the npm/node legs.
can_use = ["npm"]
fs_read = [
  ".",
  "core_unix",
  "agents_scratch",
  "~/.cache/mise",
  "~/.config/mise",
  "~/.local/share/mise",
  "~/.local/state/mise",
  "~/Library/Caches/mise"
]
fs_read_file = ["~/.local/bin/mise"]
fs_write = [
  "tmp_workspace",
  "agents_scratch",
  "/private/var/folders",
  "~/.cache/mise",
  "~/.local/share/mise",
  "~/.local/state/mise",
  "~/Library/Caches/mise"
]
fs_write_file = ["dtrace_helper_file"]

[ai.base.permissions.apply.sandbox.mise.network]
allow_domain = ["mise_runtime"]

[ai.base.permissions.command_policies]
deny = [
  "aws * create-access-key *",
  "aws * get-secret-value *",
  "az keyvault secret show *",
  "bun login",
  "bun login *",
  "bun logout",
  "bun logout *",
  # Global-apply forms, enumerated from `chezmoi apply --help`. A POSITIONAL
  # apply (`chezmoi apply <path>`) is deliberately absent: the filesystem axis
  # grants it, and the trailing-flag positional form (`<path> --force`) is
  # unexpressible in the argv matcher, so the command sandbox confines it.
  "chezmoi --destination *",
  "chezmoi --exclude *",
  "chezmoi --force *",
  "chezmoi --force apply",
  "chezmoi --include *",
  "chezmoi --remove *",
  "chezmoi --source *",
  "chezmoi -D *",
  "chezmoi -S *",
  "chezmoi -i *",
  "chezmoi -x *",
  "chezmoi apply",
  "chezmoi apply --destination *",
  "chezmoi apply --exclude *",
  "chezmoi apply --force",
  "chezmoi apply --force *",
  "chezmoi apply --include *",
  "chezmoi apply --remove",
  "chezmoi apply --remove *",
  "chezmoi apply --source *",
  "chezmoi apply -D *",
  "chezmoi apply -S *",
  "chezmoi apply -i *",
  "chezmoi apply -x *",
  # Update/clone-and-apply forms: they clone/pull a source tree and apply it
  # globally, so no destination allowlist bounds them.
  "chezmoi init --apply *",
  "chezmoi init -a *",
  "chezmoi up *",
  "chezmoi update *",
  "diskutil eraseDisk *",
  "diskutil eraseOptical *",
  "diskutil eraseVolume *",
  "diskutil partitionDisk *",
  # Privilege escalation, system administration, and raw-socket tools: hard
  # kernel floor for every sandboxed process. DCG packs cover destructive-but-
  # normal workflows (power/services/in-place edits), not these; a prompt
  # layer cannot gate them (hooks-only, direct-path exec bypasses it).
  "doas *",
  "fdisk *",
  # Standalone force flags are denied across every Git subcommand.
  # shortcut: nono 0.79 matches literal tokens only; DCG covers bundled short
  # options and valued --force-with-lease. Revisit when nono supports argv-aware matching.
  "git * --force *",
  "git * --force-if-includes *",
  "git * --force-with-lease *",
  "git * -f *",
  "gpg --export-secret-keys *",
  "gpg --export-secret-subkeys *",
  "gpg --export-secret-ssh-key *",
  "groupadd *",
  "groupdel *",
  "hf auth *",
  "ip6tables *",
  "iptables *",
  "mise run apply",
  "mise run apply *",
  "mise trust *",
  "mise untrust *",
  "mkcert *",
  "mkfs *",
  "mount *",
  "nc *",
  "ncat *",
  "netcat *",
  "nft *",
  "npm token",
  "npm token *",
  "parted *",
  "pfctl *",
  "security add-* *",
  "security delete-* *",
  "security find-*-password *",
  "security set-* *",
  "sky * --secret *",
  "socat *",
  "su",
  "su *",
  "sudo *",
  "swapoff *",
  "swapon *",
  "umount *",
  "ufw *",
  "useradd *",
  "userdel *",
  "usermod *"
]

[ai.base.permissions.filesystem]
# The engram memory store is neither base-granted nor base-denied: agents that
# run the engram MCP (opencode, omp) grant ~/.local/share/engram in their own
# sandbox profiles. A base deny would be unopenable for those MCP children
# (deny beats grants across extends); a base grant would expose the shared
# store to every session.
# shortcut: Linux DCG hook write-denials stay data-absent — a deny of the hook files kills the runtime's own startup reads (no deny-within-allow on Linux); macOS rides the seatbelt write-denies; upgrade when nono supports per-operation denies on Linux.
deny = [
  "ai_provider_creds",
  "app_data_creds",
  "cert_key_binaries",
  "cloud_creds",
  "db_client_secrets",
  "git_gh_creds",
  "gpg",
  "launch_agents",
  "macos_keychain",
  "package_creds",
  "password_manager_local",
  "password_stores",
  "private_key_files",
  "project_secrets",
  "secrets_dirs",
  "service_creds",
  "shell_history",
  "ssh",
  "terraform_state"
]
# dcg_state is a READ-tier carve-out, not a deny: agents read DCG stores,
# writes are denied (deny would also kill the reads the allowlist-edit
# remediation needs). The allow-once store stays unwritable on purpose: the
# hooks never set DCG_ALLOW_ONCE_PATH and DCG fails closed on the read-only
# default store (every block stands).
read = ["dcg_state", "pre_commit_cache", "sandbox_macos", "sandbox_macos_root", "sandbox_read_base"]
write = [
  "build_caches",
  "pre_commit_cache",
  "sandbox_macos",
  "sandbox_write_base",
  "sandbox_write_specific"
]
unix_socket_subtree = ["~/.local/share/tmux"]

[ai.base.permissions.filesystem.paths]
# Shared command-sandbox groups (referenced by apply.sandbox.* fs lists):
# recurring macOS system reads, the agents scratch dir, the cwd+TMPDIR work
# pair, and the dtrace probe device every macOS binary writes.
agents_scratch = ["/private/tmp/agents"]
ai_provider_creds = [
  "~/.anthropic/**",
  "~/.claude/**",
  "~/.codex/**",
  "~/.config/Cursor/**",
  "~/.config/Windsurf/**",
  "~/.config/anthropic/**",
  "~/.config/claude/**",
  "~/.config/continue/**",
  "~/.config/gemini/**",
  "~/.continue/**",
  "~/.cursor/**",
  "~/.gemini/**",
  "~/.openai/**",
  "~/.windsurf/**",
  "**/.anthropic/**",
  "**/.claude/**",
  "**/.codex/**",
  "**/.config/anthropic/**",
  "**/.config/claude/**",
  "**/.config/gemini/**",
  "**/.cursor/**",
  "**/.gemini/**",
  "**/.openai/**"
]
app_data_creds = [
  "~/.config/Duplicati/**",
  "~/.config/Google/**",
  "~/.config/colima/**/*_ed25519",
  "~/.config/colima/**/*_rsa",
  "~/.config/colima/**/id_*",
  "~/.config/colima/**/key.pem",
  "~/.config/configstore/**",
  "~/.config/opentofu/**",
  "~/.local/share/Amazon.com Inc./**",
  "~/.local/share/GitKrakenCLI/**",
  "~/.local/share/IsolatedStorage/**",
  "~/.local/share/azure/msal_token_cache.json",
  "~/.local/share/mkcert/rootCA-key.pem",
  "~/.local/share/ykman/**"
]
build_caches = [
  "~/.cache/bun",
  "~/.cache/chezmoi-render-cache",
  "~/.cache/go-build",
  "~/.cache/mise",
  "~/.cache/node-gyp",
  "~/.cache/npm",
  "~/.cache/pip",
  "~/.cache/pnpm",
  "~/.cache/uv",
  "~/.cache/yarn",
  "~/.cargo/git",
  "~/.cargo/registry",
  "~/.local/state/npm"
]
# Path of the rendered CA bundle (GIT_SSL_CAINFO); source of truth is
# private_dot_config/exact_shell/exact_exports.d/ca-bundle.sh.tmpl — bump together.
ca_bundle = ["~/.config/certificates/ca-bundle.pem"]
cert_key_binaries = [
  "**/*.jks",
  "**/*.keystore",
  "**/*.kdbx",
  "**/*.p12",
  "**/*.p8",
  "**/*.pfx"
]
cloud_creds = [
  "~/.config/containers/auth.json",
  "~/.config/docker/config.json",
  "~/.config/runpod/**",
  "~/.local/share/containers/auth.json",
  "~/.pulumi/**",
  "~/.runpod/**",
  "~/.terraformrc",
  "**/.aws/**",
  "**/.azure/**",
  "**/.boto",
  "**/.config/gcloud/**",
  "**/.config/runpod/**",
  "**/.docker/config.json",
  "**/.runpod/**",
  "**/.terraform.d/credentials.tfrc.json",
  "**/.terraformrc"
]
core_unix = [
  "/Library/Preferences/Logging",
  "/bin",
  "/dev",
  "/private/etc",
  "/usr"
]
db_client_secrets = ["~/.config/pg/pgpass", "~/.pgpass"]
dtrace_helper_file = ["/dev/dtracehelper"]
dcg_state = ["~/Library/Application Support/dcg/**", "~/.config/dcg/**"]
engram = ["~/.local/share/engram"]
git_gh_creds = [
  "~/.config/gh/hosts.yml",
  "~/.config/git/credentials",
  "~/.config/github-copilot/**",
  "**/.config/gh/hosts.yml",
  "**/.config/git/credentials",
  "**/.config/github-copilot/hosts.json",
  "**/.git-credentials",
  "**/.netrc"
]
gpg = ["~/.local/share/gnupg/**"]
# LaunchAgents is the launchd persistence root: a write lands OUTSIDE the
# sandbox (launchd loads plists at boot/login), so it is denied. ssh's shape:
# a dir deny covers the dir only, child plists ride the `*` key (expanded at
# sandbox start). Deny is full r+w (no write-only tier), so sandbox_macos
# lists no LaunchAgents reads (dead weight under deny-over-grant).
launch_agents = ["~/Library/LaunchAgents", "~/Library/LaunchAgents/*"]
macos_keychain = [
  "~/Library/Caches/aws/**",
  "~/Library/Caches/gcloud/**",
  "~/Library/Caches/gh/**",
  "~/Library/Group Containers/**"
]
omp_auth_files = ["~/.config/omp/agent/auth.json"]
opencode_auth_files = ["~/.local/share/opencode/auth.json"]
package_creds = [
  "~/.cargo/credentials",
  "~/.config/gradle/gradle.properties",
  # Rootless globs anchor nowhere for the apply-dest-guard floor, so the
  # anchored key makes a maven-settings destination proposal fail loud.
  "~/.config/maven/settings.xml",
  "~/.config/npm/npmrc",
  "~/.config/pip/pip.conf",
  "~/.config/pypoetry/auth.toml",
  "~/.gem/credentials",
  "~/.gradle/gradle.properties",
  "~/.local/share/cargo/credentials",
  "~/.m2/settings.xml",
  "~/.npm",
  "~/.npm/**",
  "~/.pnpmrc",
  "~/.pypirc",
  "~/.yarnrc",
  "~/.yarnrc.yml",
  "**/.cargo/credentials",
  "**/.gem/credentials",
  "**/.m2/settings.xml",
  "**/.npmrc",
  "**/.pip/pip.conf",
  "**/.pnpmrc",
  "**/.pypirc",
  "**/.yarnrc",
  "**/.yarnrc.yml",
  "**/gradle.properties",
  "**/poetry.toml",
  "**/settings.xml"
]
password_manager_local = [
  "~/.config/1Password/**",
  "~/.config/AWS VPN Client/**",
  "~/.config/AWSVPNClient/**",
  "~/.config/Bitwarden/**",
  "~/.config/Gemalto/**",
  "~/.config/gopass/**",
  "~/.config/keepassxc/**",
  "~/.config/lftp/**",
  "~/.config/rclone/**",
  "~/.config/rbw/**",
  "~/.local/share/keyrings/**",
  "~/.local/share/kwalletd/**"
]
password_stores = [
  "~/.config/age/**",
  "~/.config/sops/**",
  "~/.local/share/pass/**"
]
pi_auth_files = [
  "~/.config/pi/agent/auth.json",
  "~/.config/pi/profiles/core/auth.json",
  "~/.config/pi/profiles/factory/auth.json"
]
pre_commit_cache = [
  "~/.cache/pre-commit",
  # mise's pre-commit shim bootstraps its zipapp cache here on first run
  "~/.cache/pre-commit-zipapp"
]
private_key_files = [
  "**/*.asc",
  "**/*.key",
  "**/*.pem.bak",
  "**/*_ed25519",
  "**/*_ed25519.bak",
  "**/*_ed25519.old",
  "**/*_ed25519.pub",
  "**/*_rsa",
  "**/*_rsa.bak",
  "**/*_rsa.old",
  "**/*_rsa.pub",
  "**/*-key.pem",
  "**/*id_ed25519*",
  "**/*id_rsa*",
  "**/*id_rsa.bak",
  "**/*id_rsa.old",
  "**/key.pem",
  "**/private*.pem"
]
project_secrets = [
  # The launching shell's credential store (direnv); agents supply it, never read it.
  ".env",
  ".env.*",
  ".envrc",
  "**/.direnv/**",
  "**/.env",
  "**/.env.*",
  "**/.envrc",
  "**/.envrc.local",
  "**/.envrc.private",
  "**/.envrc.secret",
  "**/.htpasswd"
]
# App-support paths agents read and write. No bare `~/Library` (recursive
# write over the whole macOS user tree); no LaunchAgents keys (launch_agents
# denies them and deny-over-grant kills the reads).
sandbox_macos = [
  "~/Library/Application Support",
  "~/Library/Application Support/Code",
  "~/Library/Application Support/Code/User",
  "~/Library/Application Support/Code/User/keybindings.json",
  "~/Library/Application Support/Code/User/settings.json",
  "~/Library/Application Support/Cursor",
  "~/Library/Application Support/Cursor/User",
  "~/Library/Application Support/Cursor/User/keybindings.json",
  "~/Library/Application Support/Cursor/User/settings.json",
  "~/Library/Caches/go-build",
  "~/Library/Caches/node-gyp",
  "~/Library/Fonts",
  "~/Library/Scripts",
  "~/Library/Scripts/setenv.sh"
]
# Bare ~/Library is READ-only: tools probe app-support layouts at boot; the
# write tier dropped it (see sandbox_macos).
sandbox_macos_root = ["~/Library"]
sandbox_read_base = [
  ".",
  "~/.agents",
  "~/.cache/chezmoi",
  "~/.config",
  "~/.editorconfig",
  "~/.local/share",
  "~/.omlx"
]
sandbox_write_base = [
  ".",
  "~/.agents",
  "~/.cache/chezmoi",
  "~/.editorconfig",
  "~/.omlx"
]
sandbox_write_specific = [
  # Dir (not just the boltdb file): chezmoi opens its state dir for lock/temp
  # files, so agents could not run `chezmoi diff` in-sandbox with a file grant.
  "~/.config/chezmoi",
  "~/.local/share/dotfiles/test",
  "~/.local/share/tmux",
  # mise trusts repo configs by writing symlinks under state (in-sandbox mise);
  # the trust store leaf itself is denied by render-nono-fs (self-trust defeat).
  "~/.local/state/mise"
]
secrets_dirs = [
  "**/.credentials/**",
  "**/.secrets/**",
  "**/credentials/**",
  "**/secrets/**"
]
service_creds = [
  "~/.config/.wrangler/**",
  "~/.config/netlify/config.json",
  "~/.config/ngrok/ngrok.yml",
  "~/.config/turso/**",
  "~/.config/vercel/auth.json",
  "~/.fly/config.yml",
  "~/.huggingface/token",
  "~/.supabase/**",
  "**/.config/netlify/config.json",
  "**/.config/ngrok/ngrok.yml",
  "**/.config/vercel/auth.json",
  "**/.huggingface/token"
]
shell_history = [
  "~/.lesshst",
  "~/.local/share/atuin/**",
  "~/.local/state/bash/history",
  "~/.local/state/zsh/history",
  "~/.mongosh_history",
  "~/.mysql_history",
  "~/.psql_history",
  "~/.rediscli_history",
  "~/.sqlite_history"
]
# nono 0.79.0's deny_credentials does NOT cover ~/.ssh, and reads are
# default-allowed (system_read_macos's /System/Volumes firmlink makes home
# readable). A literal directory deny covers only the dir itself (ls EPERM vs
# cat allowed), so the direct-child keys are denied too; `~/.ssh/*` expands at
# sandbox start.
ssh = ["~/.config/ssh/**", "~/.ssh", "~/.ssh/*"]
terraform_state = [
  "**/*.auto.tfvars",
  "**/*.auto.tfvars.json",
  "**/*.tfstate",
  "**/*.tfstate.*",
  "**/*.tfvars",
  "**/*.tfvars.json",
  "**/.kube/config",
  "**/.terraform/**",
  "**/*kubeconfig*",
  "**/kubeconfig.secret*",
  "**/secret.tfvars",
  "**/secret.tfvars.json"
]
# `$TMPDIR` is the render-time sentinel (expand-tmpdir); "." is the cwd.
tmp_workspace = ["$TMPDIR", "."]

