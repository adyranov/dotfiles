  "**/.yarnrc.yml",
  "**/.cargo/credentials",
  "**/.gem/credentials",
  "**/.m2/settings.xml",
  "**/.pip/pip.conf",
  "**/gradle.properties",
  "**/poetry.toml",
  "**/settings.xml",
  "~/.gem/credentials",
  "~/.cargo/credentials",
