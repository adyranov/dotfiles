[ai.base.permissions.network.localhost]
# macOS: allow sandboxed processes to reach host localhost services.
allow_outbound = true
# Linux: host localhost ports forwarded into the isolated network namespace.
forward_ports = [7437, 19432]

[ai.base.permissions.sandbox]
allow_read = [
  "~/.config/certificates/ca-bundle.pem",
  "~/.config/npm/npmrc",
  "~/.config/agents/**",
  "~/.config/greywall/**",
  "~/.local/share/engram",
  "~/.local/share/engram/**"
