# Slim agent -> tier class (resolved per preset by the factory slim plugin
# config; the suites read the same key so renderer and tests cannot drift).
[ai.base.agents.opencode.agent_tiers]
designer = "visual"
explorer = "small"
fixer = "medium"
librarian = "small"
oracle = "oracle"
orchestrator = "big"

[ai.base.agents.opencode.instructions]
files = ["AGENTS.md", "OPENCODE.md"]

[ai.base.agents.opencode.profiles.core]
extends = "minimal"
plugins = ["@dietrichgebert/ponytail"]
instructions = ["AGENTS.md", "OPENCODE.md"]

[ai.base.agents.opencode.profiles.core.mcp_servers.codegraph]
type = "local"
command = ["codegraph", "serve", "--mcp"]
enabled = true

[ai.base.agents.opencode.profiles.core.mcp_servers.engram]
type = "local"
command = ["engram", "mcp", "--tools=agent"]
enabled = true

[ai.base.agents.opencode.profiles.factory]
extends = "core"
default_agent = "orchestrator"
plugins = ["oh-my-opencode-slim", "./plugins/compound-engineering.js"]
disabled_agents = ["build", "explore", "general", "plan", "scout"]
skills_paths = [
  "~/.config/agents/libraries/skills/compound-engineering",
  "~/.config/agents/libraries/skills/oh-my-opencode-slim"
]

[ai.base.agents.opencode.profiles.minimal]
plugins = ["./plugins/dcg-guard.js"]

[ai.base.agents.opencode.sandbox]
# opencode's Bun runtime reads global CFPreferences at boot; preference reads
# are platform operations, so the grant is a raw Seatbelt rule.
unsafe_macos_seatbelt_rules = ["(allow user-preference-read)"]

[ai.base.agents.opencode.sandbox.filesystem]
# No keychain grant: reading login.keychain-db in-sandbox is a credential-read
# path. Bun's TLS verification loses its trust source — probe cert errors on the
# first applied run.
# opencode's own auth store (ChatGPT/OIDC tokens) must be readable by the
# sandboxed opencode runtime — Seatbelt has no parent-read/child-deny tier, so
# denying it here kills the runtime's login/refresh, not just tool children.
# Model-side protection is the other guards: command-sandbox lists never grant
# opencode paths, proxy credential injection, DCG. Cross-agent theft stays
# denied (pi_auth_files, omp_auth_files here; opencode_auth_files denied in
# pi/omp profiles).
deny = ["omp_auth_files", "pi_auth_files"]
read = [
  # DCG plugin file: readable (opencode loads it) but write-denied via the
  # read-tier carve-out — agents must not self-edit hooks.
  "~/.config/opencode/plugins/dcg-guard.js",
  "~/.cache/opencode",
  # Engram memory store (MCP child state; children inherit this sandbox and
  # crash at startup without the grant). The codegraph home state dir rides
  # the shared write tier.
  "engram",
  "~/.local/share/opencode",
  "~/.local/state/opencode",
  "/tmp/compound-engineering"
]
write = [
  "~/.cache/opencode",
  "engram",
  "~/.local/share/opencode",
  "~/.local/state/opencode",
  "/tmp/compound-engineering"
]

[ai.base.agents.opencode.settings]
autoupdate = false
share = "disabled"
snapshot = true

[ai.base.agents.opencode.settings.compaction]
auto = true
reserved = 10000

[ai.base.agents.opencode.settings.tool_output]
max_bytes = 51200
max_lines = 2000

[ai.base.agents.opencode.settings.watcher]
ignore = [
  ".cache/**",
  ".direnv/**",
  ".git/**",
  ".terraform/**",
  "build/**",
  "dist/**",
  "node_modules/**"
]

[ai.base.agents.opencode.skills]
paths = ["~/.config/agents/skills"]
