[ai.base.agents.opencode.instructions]
files = ["AGENTS.md", "OPENCODE.md"]

[ai.base.agents.opencode.permissions.agent]
allow = []
ask = []
deny = ["~/.local/share/opencode/auth.json"]

[ai.base.agents.opencode.profiles.core]
extends = "minimal"
plugins = ["@plannotator/opencode", "./plugins/caveman/plugin.js"]
instructions = ["AGENTS.md", "OPENCODE.md", "CAVEMAN.md"]
plannotator = {plan_dir = "docs/plans/", planning_agents = ["plan"], workflow = "plan-agent"}

[ai.base.agents.opencode.profiles.core.mcp_servers.engram]
type = "local"
command = ["engram", "mcp", "--tools=agent"]
enabled = true

[ai.base.agents.opencode.profiles.factory]
extends = "core"
default_agent = "orchestrator"
plugins = ["oh-my-opencode-slim"]
disabled_agents = ["build", "explore", "general", "plan", "scout"]
plannotator = {plan_dir = "docs/plans/", plan_only = true, workflow = "plan-agent"}
skills_paths = [
  "~/.config/agents/libraries/skills/compound-engineering",
  "~/.config/agents/libraries/skills/oh-my-opencode-slim"
]

[ai.base.agents.opencode.profiles.minimal]
plugins = ["@tarquinen/opencode-dcp", "opencode-notify", "@slkiser/opencode-quota"]

[ai.base.agents.opencode.sandbox.paths]
allow_read = [
  "~/.config/opencode/**",
  "~/.local/share/plannotator",
  "~/.local/share/plannotator/**",
  "/tmp/compound-engineering",
  "/tmp/compound-engineering/**"
]
allow_write = [
  "~/.cache/opencode",
  "~/.cache/opencode/**",
  "~/.local/share/opencode",
  "~/.local/share/opencode/**",
  "~/.local/share/plannotator",
  "~/.local/share/plannotator/**",
  "~/.local/state/opencode",
  "~/.local/state/opencode/**",
  "/tmp/agents/opencode",
  "/tmp/agents/opencode/**",
  "/tmp/compound-engineering",
  "/tmp/compound-engineering/**",
  "/tmp/greywall-open-url",
  "/tmp/greywall-open-url/**"
]

[ai.base.agents.opencode.settings]
autoupdate = false
share = "disabled"
snapshot = true

[ai.base.agents.opencode.settings.compaction]
auto = true
reserved = 10000

[ai.base.agents.opencode.settings.tool_output]
max_bytes = 51200
max_lines = 2000

[ai.base.agents.opencode.settings.watcher]
ignore = [
  ".cache/**",
  ".direnv/**",
  ".git/**",
  ".terraform/**",
  "build/**",
  "dist/**",
  "node_modules/**"
]

[ai.base.agents.opencode.skills]
paths = ["~/.config/agents/skills"]
