[ai.base.agents.omp]

[ai.base.agents.omp.mcp_servers.codegraph]
args = ["serve", "--mcp"]
command = "codegraph"

[ai.base.agents.omp.sandbox.network]
hosts = ["api.openai.com", "auth.openai.com", "opencode.ai"]

[ai.base.agents.omp.sandbox.paths]
allow_read = [
  "~/.config/omp/**",
  "~/.config/agents/**",
  "~/.local/share/omp",
  "~/.local/share/omp/**",
  "/tmp/agents/omp",
  "/tmp/agents/omp/**"
]
allow_write = [
  "~/.config/omp",
  "~/.config/omp/**",
  # DB sidecars and runtime state
  "~/.config/omp/agent.db",
  "~/.config/omp/agent.db-wal",
  "~/.config/omp/agent.db-shm",
  # Session/sandbox runtime dirs
  "~/.local/share/omp",
  "~/.local/share/omp/**",
  "/tmp/agents/omp",
  "/tmp/agents/omp/**",
  # CodeGraph runtime state
  "**/.codegraph/**"
]
deny_read = [
  "~/.config/pi/agent/auth.json",
  "~/.config/pi/profiles/core/auth.json",
  "~/.config/pi/profiles/factory/auth.json",
  "~/.local/share/opencode/auth.json",
  "~/.local/share/pi-lens/**",
  "~/.config/greywall/**",
  "~/.local/share/plannotator/**",
  "~/.local/share/engram/**",
  "~/.config/age/**",
  "~/.ssh/**",
  "~/.gnupg/**",
  "~/.password-store/**",
  "~/.config/gh/hosts.yml",
  "~/.config/git/credentials",
  "**/.env",
  "**/.env.*"
]
deny_write = [
  "~/.config/pi/agent/auth.json",
  "~/.config/pi/profiles/core/auth.json",
  "~/.config/pi/profiles/factory/auth.json",
  "~/.local/share/opencode/auth.json",
  "~/.config/agents/**",
  "~/.config/greywall/**",
  "~/.config/omp/security.yml"
]

[ai.base.agents.omp.security.commands]
enable_claude_user = false
enable_claude_project = false
enable_opencode_user = false
enable_opencode_project = false

[ai.base.agents.omp.security.mcp]
enable_project_config = false

[ai.base.agents.omp.security.skills]
enabled = true
enable_skill_commands = true
enable_codex_user = false
enable_claude_user = false
enable_claude_project = false
enable_pi_user = false
enable_pi_project = false
enable_agents_user = true
enable_agents_project = false

[ai.base.agents.omp.security.startup]
check_update = false
setup_wizard = false

[ai.base.agents.omp.security.task]
eager = "preferred"
max_concurrency = 4
max_recursion_depth = 2
max_runtime_ms = 900000

[ai.base.agents.omp.security.task.isolation]
apply = true
merge = "patch"
mode = "auto"

[ai.base.agents.omp.security.tools]
approval_mode = "yolo"

[ai.base.agents.omp.settings]
theme_dark = "dark-catppuccin"
theme_light = "light-catppuccin"
symbol_preset = "nerd"
providers = ["azure", "openai-codex", "anthropic", "zai", "kimi-code", "openrouter", "github-copilot", "cursor", "devin", "google-antigravity", "google-gemini-cli", "openai-codex-device", "xai-oauth", "gitlab-duo", "gitlab-duo-workflow", "alibaba-coding-plan", "aimlapi", "zhipu-coding-plan", "umans", "qwen-portal", "sakana", "minimax-code", "minimax-code-cn", "xiaomi", "xiaomi-token-plan-sgp", "xiaomi-token-plan-ams", "xiaomi-token-plan-cn", "firepass", "deepseek", "moonshot", "cerebras", "fireworks", "together", "nvidia", "huggingface", "perplexity", "qianfan", "venice", "synthetic", "nanogpt", "wafer-serverless", "coreweave", "vercel-ai-gateway", "cloudflare-ai-gateway", "litellm", "kilo", "zenmux", "opencode-zen", "opencode-go", "tavily", "kagi", "parallel", "ollama", "ollama-cloud", "lm-studio", "llama.cpp", "vllm", "openai", "google", "google-vertex", "xai", "groq", "mistral", "minimax", "amazon-bedrock"]
