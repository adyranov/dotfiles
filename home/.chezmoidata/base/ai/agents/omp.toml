[ai.base.agents.omp]

[ai.base.agents.omp.mcp_servers.codegraph]
args = ["serve", "--mcp"]
command = "codegraph"

[ai.base.agents.omp.sandbox.network]
hosts = ["api.openai.com", "auth.openai.com", "opencode.ai"]
allow = [{ host = "infer01", port = 8080 }]
allow_unix_sockets = ["/tmp/agents/omp", "~/.config/omp/run"]

[ai.base.agents.omp.sandbox.paths]
allow_read = [
  "~/.config/omp/**",
  "~/.config/agents/**",
  "~/.local/share/omp",
  "~/.local/share/omp/**",
  "/tmp/agents/omp",
  "/tmp/agents/omp/**"
]
allow_write = [
  "~/.config/omp",
  "~/.config/omp/**",
  # DB sidecars and runtime state
  "~/.config/omp/agent.db",
  "~/.config/omp/agent.db-wal",
  "~/.config/omp/agent.db-shm",
  # Session/sandbox runtime dirs
  "~/.local/share/omp",
  "~/.local/share/omp/**",
  "/tmp/agents/omp",
  "/tmp/agents/omp/**",
  # CodeGraph runtime state
  "**/.codegraph/**"
]
deny_read = [
  "~/.config/pi/agent/auth.json",
  "~/.config/pi/profiles/core/auth.json",
  "~/.config/pi/profiles/factory/auth.json",
  "~/.local/share/opencode/auth.json",
  "~/.local/share/pi-lens/**",
  "~/.config/greywall/**",
  "~/.local/share/engram/**",
  "~/.config/age/**",
  "~/.ssh/**",
  "~/.gnupg/**",
  "~/.password-store/**",
  "~/.config/gh/hosts.yml",
  "~/.config/git/credentials",
  "**/.env",
  "**/.env.*"
]
deny_write = [
  "~/.config/pi/agent/auth.json",
  "~/.config/pi/profiles/core/auth.json",
  "~/.config/pi/profiles/factory/auth.json",
  "~/.local/share/opencode/auth.json",
  "~/.config/agents/**",
  "~/.config/greywall/**"
]

[ai.base.agents.omp.settings]
theme_dark = "dark-catppuccin"
theme_light = "light-catppuccin"
symbol_preset = "nerd"
