# Credential policy for the nono sandbox (rendered by render-credentials).
#
# routes       = credential rows: scrubbed from the agent env, proxy-injected at
# egress; the agent holds only the phantom named by env_var.
# env_injected = gap set: the client cannot honor a base-URL override, so its
# real value enters the agent env and is redacted in logs.
# secrets      = names scrubbed from every sandbox. ignore = non-secrets.
# sprig merge REPLACES arrays, so all credential data stays in the base section.
# deny_vars = unique(secrets + enabled provider keys) - env_injected - ignore.

[ai.base.credentials]
# Host capability: true in the darwin layer; on Linux only in that host's
# own data, once `nono setup` reports Landlock per-port proxy enforcement.
routes_enabled = false
# The only credential services nono 0.79.0 can activate (measured: the service list is
# validated against exactly these names). A route outside it defines a proxy path that
# injects nothing, so render-nono-net refuses it.
built_in_services = ["anthropic", "gemini", "github", "gitlab", "google-ai", "openai"]
env_injected = { GEMINI_API_KEY = "nono does not support proxy credential injection for Gemini clients (documented: use environment credential injection)", GOOGLE_API_KEY = "same client family as GEMINI_API_KEY", BRAVE_SEARCH_API_KEY = "no built-in brave service exists in nono 0.79.0, so no route can be activated for it; the MCP tool needs the real value" }
# Scrubbed from every sandbox, and auto-redacted in diagnostics (redaction is scoped to
# exact deny_vars names). Provider keys stay here: agents run model traffic through
# file/gateway auth, so removing these buys nothing and puts values in the model context.
# DOCKERHUB_TOKEN is observed passthrough (seen in a probe sandbox env) and joins here.
secrets = [
  "BRAVE_SEARCH_API_KEY",
  "OPENCODE_API_KEY",
  "OPENAI_API_KEY",
  "ANTHROPIC_API_KEY",
  "GOOGLE_API_KEY",
  "GEMINI_API_KEY",
  "OPENROUTER_API_KEY",
  "GROQ_API_KEY",
  "DEEPSEEK_API_KEY",
  "MISTRAL_API_KEY",
  "XAI_API_KEY",
  "PERPLEXITY_API_KEY",
  "FIRECRAWL_API_KEY",
  "EXA_API_KEY",
  "TAVILY_API_KEY",
  "SERPER_API_KEY",
  "SERPAPI_API_KEY",
  "JINA_API_KEY",
  "DOCKERHUB_TOKEN",
  "GITHUB_TOKEN",
  "GH_TOKEN",
  "HF_TOKEN",
  "AI_GATEWAY_API_KEY",
  "CLOUDFLARE_API_KEY",
  "AWS_ACCESS_KEY_ID",
  "AWS_SECRET_ACCESS_KEY",
  "AWS_SESSION_TOKEN",
  "AWS_BEARER_TOKEN_BEDROCK",
  "AZURE_OPENAI_API_KEY",
  "AZURE_OPENAI_AD_TOKEN",
  "GOOGLE_APPLICATION_CREDENTIALS",
  "DCG_*"
]
ignore = ["PUBLIC_API_TOKEN"]

# Keyed by the credential's env var name; every row renders as one custom_credentials
# entry (a preset name replaces the built-in). credential_key defaults to env://<key>
# (read supervisor-side), env_var is the phantom the sandbox sees.
[ai.base.credentials.routes]

[ai.base.credentials.routes.ANTHROPIC_API_KEY]
preset = "anthropic"
upstream = "https://api.anthropic.com"
env_var = "ANTHROPIC_API_KEY"
inject_header = "authorization"
credential_format = "Bearer {}"

[ai.base.credentials.routes.GITHUB_TOKEN]
# gh reads GH_TOKEN before GITHUB_TOKEN, so the phantom lands in GH_TOKEN.
preset = "github"
upstream = "https://api.github.com"
env_var = "GH_TOKEN"
inject_header = "authorization"
credential_format = "Bearer {}"

[ai.base.credentials.routes.OPENAI_API_KEY]
# No preset: the built-in openai route reads the OS keyring (not portable).
custom_name = "openai"
upstream = "https://api.openai.com"
env_var = "OPENAI_API_KEY"
inject_header = "authorization"
credential_format = "Bearer {}"
