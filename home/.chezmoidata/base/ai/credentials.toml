# Credential injection protection for Greywall sandbox.
#
# inject = vars pulled from Greyproxy DB and set as marker env vars in sandbox.
# secrets = vars auto-detected as credentials even if host env has them (prevent agent from seeing real values).
# ignore = vars excluded from secret detection (false-positive names).
#
# Merge rule: base + profile; inject/ignore/sort/dedupe.
# secrets_final = unique(base.secrets + profile.secrets) - inject_final - ignore_final

[ai.base.credentials]
inject = ["GITHUB_TOKEN"]
secrets = [
  "BRAVE_SEARCH_API_KEY",
  "OPENCODE_API_KEY",
  "OPENAI_API_KEY",
  "ANTHROPIC_API_KEY",
  "GOOGLE_API_KEY",
  "GEMINI_API_KEY",
  "OPENROUTER_API_KEY",
  "GROQ_API_KEY",
  "DEEPSEEK_API_KEY",
  "MISTRAL_API_KEY",
  "XAI_API_KEY",
  "PERPLEXITY_API_KEY",
  "FIRECRAWL_API_KEY",
  "EXA_API_KEY",
  "TAVILY_API_KEY",
  "SERPER_API_KEY",
  "SERPAPI_API_KEY",
  "JINA_API_KEY",
  "GITHUB_TOKEN",
  "HF_TOKEN",
  "AI_GATEWAY_API_KEY",
  "CLOUDFLARE_API_KEY",
  "AWS_ACCESS_KEY_ID",
  "AWS_SECRET_ACCESS_KEY",
  "AWS_SESSION_TOKEN",
  "AWS_BEARER_TOKEN_BEDROCK",
  "AZURE_OPENAI_API_KEY",
  "AZURE_OPENAI_AD_TOKEN",
  "GOOGLE_APPLICATION_CREDENTIALS"
]
ignore = ["PUBLIC_API_TOKEN"]
