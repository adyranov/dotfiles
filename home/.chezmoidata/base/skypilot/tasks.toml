# SkyPilot task catalog — 9 cloud-only tasks (all request >=48GB VRAM)
# kind = "sglang" | "comfyui"
#
# RunPod Network Volume — disabled by default (safe default). To enable:
# 1. Create a RunPod Network Volume (name <=30 chars, e.g. "skypilot-cache")
# in the RunPod console: https://runpod.io/console/user/storage
# 2. Set volume_name and infra to match your volume's zone (runpod/<ZONE>)
# 3. Set enabled = true
# Requires native SkyPilot `volumes:` — same RunPod zone as the GPU pod.
# Supports HF_HOME / model caches on persistent storage.
# Overrides: os/<distro>/skypilot.toml, profile/<name>/skypilot.toml

[skypilot.base.runpod]
enabled = false
volume_name = "REPLACE_ME"
infra = "runpod/REPLACE_ZONE"
mount_path = "/workspace"

