[packages.base.ai]
# uvx_args pins uv's interpreter to 3.13: pyzmq ships no cp314+ wheels, so the
# sdist build on newer Python fails (aiperf itself requires <3.14).
aiperf = { manager = "mise", package = "pipx:aiperf", uvx_args = "--python 3.13", version = "aiperf --help" }
# Language servers consumed by each agent's LSP plugin (present whenever the ai
# umbrella is on, so any enabled agent can serve its own languages).
codegraph = { manager = "mise", package = "github:colbymchenry/codegraph" }
engram = { bin = "engram", manager = "mise", package = "github:Gentleman-Programming/engram", version = "engram version", platforms = { linux-arm64 = { asset_pattern = "engram_*_linux_arm64.tar.gz" }, linux-x64 = { asset_pattern = "engram_*_linux_amd64.tar.gz" }, macos-arm64 = { asset_pattern = "engram_*_darwin_arm64.tar.gz" }, macos-x64 = { asset_pattern = "engram_*_darwin_amd64.tar.gz" } } }
# aqua-registry moved gopls to its canonical Go path as a go_install asset,
# which mise's aqua backend rejects; the go backend installs it directly
# (resolves gopls/v0.24.0; go toolchain is mise-managed via core packages).
# gopls uses Go's flag package: `--version` is an unknown flag (exit 2); the
# version lives in the `version` subcommand.
gopls = { manager = "mise", package = "go:golang.org/x/tools/gopls", version = "gopls version" }
hf = { completion = { generate = "env _HF_COMPLETE=zsh_source hf" }, manager = "mise", package = "pipx:huggingface_hub", version = "hf version" }
llamacpp = { bin = "llama-server", manager = "mise", package = "github:ggml-org/llama.cpp" }
# Serves the official pyright-lsp plugin (the marketplace has no basedpyright-lsp).
pyright = { manager = "mise", package = "npm:pyright" }
rtk = { manager = "mise", package = "github:rtk-ai/rtk", version = "rtk --version" }
runpod = { manager = "mise", package = "pipx:runpod", test = "runpod --help", completion = { generate = "env _RUNPOD_COMPLETE=zsh_source runpod" } }
# aqua release build, not the rustup component: mise installs the server binary directly.
rust-analyzer = { manager = "mise", package = "aqua:rust-lang/rust-analyzer" }
# uvx_args pins uv's interpreter to 3.13: on Python 3.15 sky's adaptors bind
# yaml through importlib.util.LazyImport (new in 3.15) and `sky --version`
# dies with `'LazyImport' object is not callable` (skypilot 0.14.2).
skypilot = { bin = "sky", completion = { generate = "env _SKY_COMPLETE=zsh_source sky" }, manager = "mise", package = "pipx:skypilot", uvx_args = "--python 3.13", extras = "runpod,vast,lambda" }
typescript-language-server = { manager = "mise", package = "npm:typescript-language-server" }
