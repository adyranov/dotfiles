[packages.base.ai]

[packages.base.ai.aiperf]
manager = "mise"
package = "pipx:aiperf"
version = "aiperf --help"

[packages.base.ai.engram]
bin = "engram"
manager = "mise"
package = "github:Gentleman-Programming/engram"
version = "engram version"

[packages.base.ai.engram.platforms]
linux-arm64 = {asset_pattern = "engram_*_linux_arm64.tar.gz"}
linux-x64 = {asset_pattern = "engram_*_linux_amd64.tar.gz"}
macos-arm64 = {asset_pattern = "engram_*_darwin_arm64.tar.gz"}
macos-x64 = {asset_pattern = "engram_*_darwin_amd64.tar.gz"}

[packages.base.ai.hf]
completion = {generate = "env _HF_COMPLETE=source_zsh hf"}
manager = "mise"
package = "pipx:huggingface_hub"
version = "hf version"

[packages.base.ai.hf.policy]
deny = [
  "hf auth *",
  "hf repo create *",
  "hf repo delete *",
  "hf repo upload *",
  "hf upload *"
]

[packages.base.ai.llamacpp]
bin = "llama-server"
manager = "mise"
package = "github:ggml-org/llama.cpp"

[packages.base.ai.rtk]
manager = "mise"
package = "github:rtk-ai/rtk"
