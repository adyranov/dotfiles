[packages.base.ai]
# uvx_args pins uv's interpreter to 3.13: pyzmq ships no cp314+ wheels, so the
# sdist build on newer Python fails (aiperf itself requires <3.14).
aiperf = { manager = "mise", package = "pipx:aiperf", uvx_args = "--python 3.13", version = "aiperf --help" }
codegraph = { manager = "mise", package = "github:colbymchenry/codegraph" }
engram = { bin = "engram", manager = "mise", package = "github:Gentleman-Programming/engram", version = "engram version", platforms = { linux-arm64 = { asset_pattern = "engram_*_linux_arm64.tar.gz" }, linux-x64 = { asset_pattern = "engram_*_linux_amd64.tar.gz" }, macos-arm64 = { asset_pattern = "engram_*_darwin_arm64.tar.gz" }, macos-x64 = { asset_pattern = "engram_*_darwin_amd64.tar.gz" } } }
hf = { completion = { generate = "env _HF_COMPLETE=zsh_source hf" }, manager = "mise", package = "pipx:huggingface_hub", version = "hf version" }
llamacpp = { bin = "llama-server", manager = "mise", package = "github:ggml-org/llama.cpp" }
rtk = { manager = "mise", package = "github:rtk-ai/rtk", version = "rtk --version" }
runpod = { manager = "mise", package = "pipx:runpod", test = "runpod --help", completion = { generate = "env _RUNPOD_COMPLETE=zsh_source runpod" } }
skypilot = { bin = "sky", completion = { generate = "env _SKY_COMPLETE=zsh_source sky" }, manager = "mise", package = "pipx:skypilot", extras = "runpod,vast,lambda" }
