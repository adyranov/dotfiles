[packages.base.opencode]

[packages.base.opencode.opencode]
manager = "mise"

[packages.base.opencode.opencode.policy]
deny = [
  "opencode auth",
  "opencode auth *",
  "opencode login",
  "opencode login *",
  "opencode logout",
  "opencode logout *",
  "opencode models login",
  "opencode models login *"
]
