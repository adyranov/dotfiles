[ai.profile.personal.presets]
default = "qwen"

[ai.profile.personal.presets.balanced.council]
# 2 councillors — cross-provider fallbacks for fault tolerance
alpha = { provider = "openai-codex", model = "gpt-6.1-sol", thinking = "high", fallbacks = [{ provider = "deepseek", model = "deepseek-v4-pro", thinking = "high" }] }
beta = { provider = "deepseek", model = "deepseek-v4-pro", thinking = "high", fallbacks = [{ provider = "openai-codex", model = "gpt-6-luna", thinking = "high" }] }

[ai.profile.personal.presets.balanced.tiers]
small = { provider = "opencode-zen", model = "deepseek-v4.1-flash", thinking = "off", fallbacks = [{ provider = "deepseek", model = "deepseek-flash", thinking = "off" }] }
medium = { provider = "opencode-zen", model = "deepseek-v4.1-flash", thinking = "high", fallbacks = [{ provider = "deepseek", model = "deepseek-flash", thinking = "high" }] }
big = { provider = "openai-codex", model = "gpt-6-luna", thinking = "high", fallbacks = [{ provider = "deepseek", model = "deepseek-v4-pro", thinking = "high" }, { provider = "opencode-zen", model = "deepseek-v4.1-flash", thinking = "high" }] }
oracle = { provider = "openai-codex", model = "gpt-6.1-sol", thinking = "max", fallbacks = [{ provider = "deepseek", model = "deepseek-v4-pro", thinking = "max" }, { provider = "opencode-zen", model = "deepseek-v4.1-flash", thinking = "high" }] }
visual = { provider = "openai-codex", model = "gpt-6-luna", thinking = "medium", fallbacks = [{ provider = "deepseek", model = "deepseek-v4-pro", thinking = "medium" }] }

[ai.profile.personal.presets.deepseek.council]
alpha = { provider = "deepseek", model = "deepseek-v4-pro", thinking = "high" }
beta = { provider = "deepseek", model = "deepseek-flash", thinking = "high" }

[ai.profile.personal.presets.deepseek.tiers]
small = { provider = "deepseek", model = "deepseek-flash", thinking = "off" }
medium = { provider = "deepseek", model = "deepseek-flash", thinking = "high" }
big = { provider = "deepseek", model = "deepseek-v4-pro", thinking = "high" }
oracle = { provider = "deepseek", model = "deepseek-v4-pro", thinking = "max" }
visual = { provider = "deepseek", model = "deepseek-v4-pro", thinking = "medium" }

[ai.profile.personal.presets.openai.council]
alpha = { provider = "openai-codex", model = "gpt-6.1-sol", thinking = "high" }
beta = { provider = "openai-codex", model = "gpt-6-luna", thinking = "high" }

[ai.profile.personal.presets.openai.tiers]
small = { provider = "openai-codex", model = "gpt-6-luna", thinking = "off" }
medium = { provider = "openai-codex", model = "gpt-6-luna", thinking = "medium" }
big = { provider = "openai-codex", model = "gpt-6-luna", thinking = "high" }
oracle = { provider = "openai-codex", model = "gpt-6.1-sol", thinking = "high" }
visual = { provider = "openai-codex", model = "gpt-6.1-sol", thinking = "medium" }

# Qwen preset: local infer01, no fallbacks, no council. Local model, so the
# only cost of deep reasoning is wall-clock — off for trivial lookups, xhigh
# for everything else.
[ai.profile.personal.presets.qwen]
subagent_limit = 4

[ai.profile.personal.presets.qwen.tiers]
small = { provider = "infer01", model = "qwen3.8-flash-next", thinking = "off" }
medium = { provider = "infer01", model = "qwen3.8-flash-next", thinking = "xhigh" }
big = { provider = "infer01", model = "qwen3.8-flash-next", thinking = "xhigh" }
oracle = { provider = "infer01", model = "qwen3.8-flash-next", thinking = "xhigh" }
visual = { provider = "infer01", model = "qwen3.8-flash-next", thinking = "xhigh" }

[ai.profile.personal.providers]
deepseek = { enabled = true, models = ["deepseek-flash", "deepseek-v4-pro"] }
openai-codex = { enabled = true, models = ["gpt-6-luna", "gpt-6.1-sol"] }
opencode-go = { enabled = false }
opencode-zen = { api_key_env = "OPENCODE_API_KEY", auth_keys = ["opencode-zen"], enabled = true, models = ["deepseek-v4.1-flash"], opencode_alias = "opencode" }
openrouter = { enabled = true, models = ["z-ai/glm-5.2", "moonshotai/kimi-k3", "anthropic/claude-sonnet-5"] }

# Keyless OpenAI-compatible endpoint; limits declared statically (no /v1/models discovery).
[ai.profile.personal.serving.infer01]
base_url = "http://infer01:8080/v1"
kind = "openai-compatible"

[[ai.profile.personal.serving.infer01.models]]
id = "qwen3.8-flash-next"
name = "qwen3.8-flash-next"
reasoning = true
context_window = 262144
inputs = ["text", "image"]
cost = { input = 0.0, output = 0.0 }
max_output = 32768
# qwen-fixed-v22.3.jinja; OMP resolves mode/efforts from its catalog.
chat_format = "qwen-chat-template"

[ai.profile.personal.serving.local]
default_model = "qwen3-coder-30b-a3b"
engine = "llamacpp"

[[ai.profile.personal.serving.local.models]]
id = "qwen3-coder-30b-a3b"
name = "Qwen3 Coder 30B-A3B"
reasoning = false
context_window = 32768
max_output = 8192
gguf = { repo = "unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF", file = "Qwen3-Coder-30B-A3B-Instruct-UD-IQ3_XXS.gguf" }
sampling = { temperature = 0.7, top_p = 0.8, top_k = 20, min_p = 0.0, repetition_penalty = 1.05 }

[[ai.profile.personal.serving.local.models]]
id = "qwen3.5-9b"
name = "Qwen3.5 9B"
reasoning = true
context_window = 65536
max_output = 8192
gguf = { repo = "unsloth/Qwen3.5-9B-GGUF", file = "Qwen3.5-9B-UD-Q6_K_XL.gguf" }
sampling = { min_p = 0.0, presence_penalty = 1.5, repetition_penalty = 1.0, temperature = 1.0, top_k = 20, top_p = 0.95 }
