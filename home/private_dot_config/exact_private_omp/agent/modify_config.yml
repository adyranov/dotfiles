{{- /* chezmoi:modify-template */ -}}
{{- /* OMP config.yml: managed routing + settings merged over user-owned keys. */ -}}
{{- $current := dict -}}
{{- $rawStdin := get .chezmoi "stdin" | default "" | trim -}}
{{- if and (not (empty $rawStdin)) (ne $rawStdin "null") -}}
{{-   $parsed := fromYaml $rawStdin -}}
{{-   if kindIs "map" $parsed -}}{{- $current = $parsed -}}{{- end -}}
{{- end -}}
{{- /* Replace managed maps wholesale so preset switches don't retain stale routes. */ -}}
{{- $_ := unset $current "modelRoles" -}}
{{- if kindIs "map" (get $current "retry") -}}{{- $_ := unset (get $current "retry") "fallbackChains" -}}{{- end -}}
{{- if kindIs "map" (get $current "task") -}}
{{-   $_ := unset (get $current "task") "agentModelOverrides" -}}
{{-   $_ := unset (get $current "task") "disabledAgents" -}}
{{-   $_ := unset (get $current "task") "isolation" -}}
{{- end -}}
{{- if kindIs "map" (get $current "providers") -}}{{- $_ := unset (get $current "providers") "disabled" -}}{{- end -}}

{{- $prof := index .ai.profiles .host.profile -}}
{{- $tiers := (index $prof.presets $prof.default_preset).tiers -}}
{{- $s := .ai.agents.omp.settings -}}
{{- $limit := includeTemplate "base/ai/agents/resolve-subagent-limit" (dict "root" .) | int -}}

{{- /* Build primary + fallback "provider/model:thinking" strings per tier. */ -}}
{{- $primary := dict -}}
{{- $fallbacks := dict -}}
{{- range $tier, $specs := $tiers -}}
{{-   $_ := set $primary $tier (first $specs) -}}
{{-   $_ := set $fallbacks $tier (rest $specs) -}}
{{- end -}}

{{- $fallbackChains := dict
  "advisor" $fallbacks.oracle
  "commit" $fallbacks.medium
  "default" $fallbacks.big
  "oracle" $fallbacks.oracle
  "plan" $fallbacks.big
  "slow" $fallbacks.oracle
  "smol" $fallbacks.small
  "task" $fallbacks.medium
  "tiny" $fallbacks.small
  "vision" $fallbacks.visual
-}}
{{- $modelRoles := dict
  "advisor" $primary.oracle
  "commit" $primary.medium
  "default" $primary.big
  "oracle" $primary.oracle
  "plan" $primary.big
  "slow" $primary.oracle
  "smol" $primary.small
  "task" $primary.medium
  "tiny" $primary.small
  "vision" $primary.visual
-}}
{{- range $role, $tierKey := ($s.extra_model_roles | default dict) -}}
{{-   $_ := set $modelRoles $role (index $primary $tierKey) -}}
{{-   $_ := set $fallbackChains $role (index $fallbacks $tierKey) -}}
{{- end -}}

{{- $overrides := dict -}}
{{- range $agent, $tierKey := ($s.subagent_tiers | default dict) -}}
{{-   $_ := set $overrides $agent (index $primary $tierKey) -}}
{{- end -}}

{{- $isolation := dict
  "apply" (eq $s.isolation_apply "on")
  "enabled" (eq $s.isolation_enabled "on")
  "merge" $s.isolation_merge
-}}
{{- if eq .host.distro.family "darwin" -}}
{{-   $_ := set $isolation "backend" "apfs" -}}
{{- else if $s.isolation_backend -}}
{{-   $_ := set $isolation "backend" $s.isolation_backend -}}
{{- end -}}

{{- $tinyDevice := $s.tiny_model_device -}}
{{- if not $tinyDevice -}}
{{-   $tinyDevice = ternary "mlx" "cpu" (and (eq .host.distro.family "darwin") (eq .host.arch "arm64")) -}}
{{- end -}}
{{- $managed := dict
  "bash" (dict "gitGuard" (eq $s.git_guard "on"))
  "compaction" (dict "methodOrder" $s.compaction_method_order "thresholdPercent" ($s.compaction_threshold_percent | int))
  "dev" (dict "autoqa" $s.autoqa "autoqaConsent" $s.autoqa_consent)
  "disabledProviders" (list "anthropic")
  "isolation" $isolation
  "mcp" (dict "startupTimeoutMs" ($s.mcp_startup_timeout_ms | int))
  "memory" (dict "backend" "off")
  "modelRoles" $modelRoles
  "personality" $s.personality
  "provider" (dict "appendOnlyContext" $s.append_only_context)
  "providers" (dict "cacheWarming" $s.cache_warming "tinyModelDevice" $tinyDevice)
  "retry" (dict "fallbackChains" $fallbackChains "maxDelayMs" 30000 "maxRetries" 3)
  "secrets" (dict "enabled" $s.secrets_redaction)
  "security" (dict "enabled" $s.security_enabled)
  "skills" (dict "customDirectories" (list (printf "%s/.config/agents/skills" .chezmoi.homeDir)) "enablePiUser" $s.skills_enable_pi_user)
  "symbolPreset" $s.symbol_preset
  "task" (dict
    "agentModelOverrides" $overrides
    "completionProbe" $s.completion_probe
    "disabledAgents" $s.disabled_agents
    "eager" $s.task_eager
    "maxConcurrency" $limit
    "maxRuntimeMs" ($s.task_max_runtime_ms | int)
    "perCallModel" $s.per_call_model
    "prewalk" $s.task_prewalk)
  "telemetry" (dict "otlpExportEnabled" $s.telemetry_otlp_export)
  "theme" (dict "dark" $s.theme_dark "light" $s.theme_light)
  "title" (dict "generator" $s.title_generator)
  "tools" (dict "artifactSpillThreshold" ($s.artifact_spill_threshold | int))
  "update" (dict "auto" $s.update_auto)
  "worktree" (dict "base" $s.worktree_base "clone" $s.worktree_clone)
-}}
{{- if $s.composer_predictions -}}{{- $_ := set $managed "composer" (dict "predictions" (eq $s.composer_predictions "on")) -}}{{- end -}}
{{- if $s.fallback_on -}}{{- $_ := set $managed.retry "fallbackOn" $s.fallback_on -}}{{- end -}}
{{- toYaml (mergeOverwrite $current $managed) -}}
