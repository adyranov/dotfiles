# QuantTrio/Qwen3-Coder-30B-A3B-Instruct-AWQ (community AWQ/INT4 SM80+) | L40S/RTXA6000/RTX5090 | 32K | Coding tier, Qwen tool calls
name: qwen3-coder-30b-a3b-awq
resources:
  image_id: docker:lmsysorg/sglang:latest-cu129
  accelerators: {"L40S": 1, "RTX5090": 1, "RTXA6000": 1}
  use_spot: true
  job_recovery:
    strategy: FAILOVER
  disk_size: 60
run: |
  set -euxo pipefail
  TP_SIZE="$(nvidia-smi --query-gpu=name --format=csv,noheader | wc -l | tr -d ' ')"
  sglang serve \
    --model-path QuantTrio/Qwen3-Coder-30B-A3B-Instruct-AWQ \
    --host 127.0.0.1 \
    --port 8000 \
    --context-length 32768 \
    --mem-fraction-static 0.88 \
    --tp-size "$TP_SIZE" \
    --cuda-graph-backend-prefill=disabled \
    --tool-call-parser \
    qwen3_coder \
    --trust-remote-code \
    2>&1 | tee ~/server.log
secrets:
  HF_TOKEN: null
