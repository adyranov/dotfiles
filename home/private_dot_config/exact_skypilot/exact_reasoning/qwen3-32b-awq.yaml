# Qwen/Qwen3-32B-AWQ | L40S/RTXA6000/RTX5090 | 32K | Reasoning tier, qwen3 parser
name: qwen3-32b-awq
resources:
  image_id: docker:lmsysorg/sglang:latest-cu129
  accelerators: {"L40S": 1, "RTX5090": 1, "RTXA6000": 1}
  use_spot: true
  job_recovery:
    strategy: FAILOVER
  disk_size: 60
run: |
  set -euxo pipefail
  TP_SIZE="$(nvidia-smi --query-gpu=name --format=csv,noheader | wc -l | tr -d ' ')"
  sglang serve \
    --model-path Qwen/Qwen3-32B-AWQ \
    --host 127.0.0.1 \
    --port 8000 \
    --context-length 32768 \
    --mem-fraction-static 0.92 \
    --tp-size "$TP_SIZE" \
    --cuda-graph-backend-prefill=disabled \
    --reasoning-parser \
    qwen3 \
    --tool-call-parser \
    qwen3 \
    --trust-remote-code \
    2>&1 | tee ~/server.log
secrets:
  HF_TOKEN: null
