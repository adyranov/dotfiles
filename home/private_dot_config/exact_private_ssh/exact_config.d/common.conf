Host *
    # Identity & Auth
    PreferredAuthentications publickey

    # Files & Paths (use OpenSSH %d token so GUI apps/cron without SSH_DATA_HOME still work)
    UserKnownHostsFile %d/.local/share/ssh/known_hosts
    ControlPath %d/.local/share/ssh/sockets/%C

    # Multiplexing
    ControlMaster auto
    ControlPersist 10m

    # Network
    ConnectTimeout 10
    Compression no
    ServerAliveInterval 30
    ServerAliveCountMax 3
    TCPKeepAlive yes

    # Security
    StrictHostKeyChecking accept-new
    HashKnownHosts yes
    UpdateHostKeys yes
    ExitOnForwardFailure yes
    ForwardAgent no
    ForwardX11 no

SendEnv COLORTERM TERM_PROGRAM TERM_PROGRAM_VERSION
