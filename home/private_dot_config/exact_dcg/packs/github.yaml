# DCG policy pack: GitHub CLI.
# Managed source — agents cannot write here; edit the chezmoi source.
id: user.github
name: User GitHub rules
version: "1.0.0"
description: Custom denies for gh deletions, edits, variable/secret sets, raw API mutations, generic HTTP-client mutations against the granted GitHub hosts, and local git commands core.git leaves open.
keywords:
  - gh
  - git
  # Pack-level keyword gate: without the client tokens, plain `curl … github.com`
  # never reaches pattern evaluation and the http-client-write row is dead code.
  - curl
  - wget
  - http
  - https
destructive_patterns:
  - name: gh-delete
    pattern: '\bgh\b[^;&|\n]*?\bdelete'
    severity: high
    description: gh deletes remote GitHub objects
    explanation: Releases, branches, PRs and workflows are gone server-side.
  # PR edits can change the base and reviewers; other gh edits stay gated.
  - name: gh-edit
    pattern: '\bgh\b(?! (?:-R[ =]\S+ |--repo[ =]\S+ )?pr edit\b)[^;&|\n]*?\bedit\b'
    severity: medium
    description: gh edits GitHub objects in place outside the PR-edit lane
    explanation: Repo/release/issue/gist/codespace edits mutate shared GitHub state; PR edits are routine maintenance.
  - name: gh-variable-set
    pattern: '\bgh\b[^;&|\n]*?\bvariable\s+set\b'
    severity: medium
    description: gh sets repository/organization variables
    explanation: Variable changes alter CI behavior for everyone.
  # gh auth login / gh auth token need no row: token reads return the phantom,
  # login writes the relocated state, the real token is unobservable (env
  # scrub, hosts.yml floor, keychain Mach-closed).
  - name: gh-secret
    pattern: '\bgh\b[^;&|\n]*?\bsecret\b[^;&|\n]*?\b(?:set|delete|remove)\b'
    severity: high
    description: gh mutates repository/organization secrets
    explanation: Actions secrets are supply-chain input; the session tier left no command-core gate here.
  - name: gh-api-delete
    pattern: '\bgh\b[^;&|\n]*?\bapi\b[^;&|\n]*?(?:-X\s*DELETE|--method\s+DELETE)'
    severity: high
    description: gh api DELETE bypasses CLI safety
    explanation: Raw DELETEEs can remove arbitrary remote resources.
  # The gate covers the mutation shape, not one binary: the proxy attaches the
  # real token for every process on the GitHub route hosts. Reads (gh api GET
  # without field flags; plain curl/wget GETs) never match.
  - name: gh-api-write
    pattern: '\bgh\b[^;&|\n]*?\bapi\b[^;&|\n]*?(?:-X\s*(?:POST|PATCH|PUT|DELETE)|--method\s+(?:POST|PATCH|PUT|DELETE))'
    severity: high
    description: gh api sends a mutating method
    explanation: Raw API writes mutate arbitrary remote resources.
  - name: gh-api-field-write
    pattern: '\bgh\b[^;&|\n]*?\bapi\b[^;&|\n]*?(?:-f\b|-F\b|--field\b|--raw-field\b|--input\b)'
    severity: high
    description: gh api sends a payload (implicit POST)
    explanation: Field flags make gh api POST by default.
  - name: gh-workflow-run
    pattern: '\bgh\b[^;&|\n]*?\bworkflow\b[^;&|\n]*?\brun\b'
    severity: medium
    description: gh triggers a workflow run
    explanation: Runs consume runner capacity and can publish artifacts.
  # The stack extension can merge multiple PRs at once.
  - name: gh-pr-merge
    pattern: '\bgh\b[^;&|\n]*?\b(?:pr|stack)\b[^;&|\n]*?\bmerge\b'
    severity: high
    description: gh merges a pull request or a whole PR stack
    explanation: A merge lands on the base branch; gh repo edit rides the gh-edit row.
  - name: gh-release-create
    pattern: '\bgh\b[^;&|\n]*?\brelease\b[^;&|\n]*?\bcreate\b'
    severity: medium
    description: gh publishes a release
    explanation: Releases are public artifacts pinned to a tag.
  - name: http-client-write
    pattern: '\b(?:curl|wget|http|https)\b[^;&|\n]*?(?:(?:api\.github\.com|github\.com)[^;&|\n]*?(?:-X\s*(?i:POST|PATCH|PUT|DELETE)|--request\s*(?i:POST|PATCH|PUT|DELETE)|--(?:post|body)-(?:data|file)|--data|-d\b|-T\b|--upload-file\b|-F\b|--form\b|--method\s+(?i:POST|PATCH|PUT|DELETE))|(?:-X\s*(?i:POST|PATCH|PUT|DELETE)|--request\s*(?i:POST|PATCH|PUT|DELETE)|--(?:post|body)-(?:data|file)|--data|-d\b|-T\b|--upload-file\b|-F\b|--form\b|--method\s+(?i:POST|PATCH|PUT|DELETE))[^;&|\n]*?(?:api\.github\.com|github\.com))'
    severity: high
    description: generic HTTP client mutates a granted GitHub host
    explanation: The proxy swaps the real token for ANY client of these hosts.
  # Local git destructive gate: completes the retired core.toml git policy.
  # core.git (built-in) already covers clean/reset --hard/push-force; the gaps
  # it leaves open are gated here, including valued lease flags nono cannot match.
  - name: git-force-with-lease-value
    pattern: '\bgit\b[^;&|\n]*?\bpush\b[^;&|\n]*?--force-with-lease='
    severity: high
    description: git push with a valued force-with-lease flag can rewrite remote history
    explanation: The nono literal-token matcher cannot match --force-with-lease=ref:sha; this closes that spelling gap.
  # Remote ref deletion also accepts an empty-source refspec.
  - name: git-push-delete-remote
    pattern: '\bgit\b[^;&|\n]*?\bpush\b[^;&|\n]*?(?:--delete\b|\s-d\b|\s[''"]?:[^ ;])'
    severity: high
    description: git push deletes a remote branch or tag
    explanation: Remote refs are gone for everyone; ordinary pushes never carry --delete/-d or a leading-colon refspec.
  - name: git-rebase
    pattern: '\bgit\b[^;&|\n]*?\brebase\b'
    severity: high
    description: git rebase rewrites commit history
    explanation: Conflicts and rewritten SHAs can strand commits.
  - name: git-stash-drop-pop
    pattern: '\bgit\b[^;&|\n]*?\bstash\b[^;&|\n]*?\b(?:drop|pop)\b'
    severity: high
    description: git stash drop/pop consumes the stash entry
    explanation: A conflicted pop drops the entry, losing the stashed work.
  - name: git-tag-delete
    pattern: '\bgit\b[^;&|\n]*?\btag\b[^;&|\n]*?(?:\s-d\b|--delete\b)'
    severity: medium
    description: git tag -d deletes local tags
    explanation: Release tags lost locally drift from the remote.
  - name: git-worktree-remove
    pattern: '\bgit\b[^;&|\n]*?\bworktree\b[^;&|\n]*?\bremove\b'
    severity: high
    description: git worktree remove deletes a worktree directory
    explanation: --force removes it with uncommitted work inside.
