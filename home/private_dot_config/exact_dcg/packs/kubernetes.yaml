# DCG policy pack: kubectl/oc/helm/k3d overrides for families whose
# built-in packs are partial or allow-by-default (kubectl delete pod x is
# ALLOWED by kubernetes.kubectl by default, and k3d has no built-in pack).
# Managed source — agents cannot write here; edit the chezmoi source.
id: user.kubernetes
name: User Kubernetes rules
version: "1.0.0"
description: Custom denies closing kubectl/oc delete verbs, kubectl node-shell, k3d deletes, and helm destructive ops.
keywords:
  - helm
  - k3d
  - kubectl
  - oc
destructive_patterns:
  - name: kubectl-delete
    pattern: '\bkubectl\b[^;&|\n]*?\bdelete\b'
    severity: critical
    description: kubectl delete removes cluster resources
    explanation: kubernetes.kubectl only blocks mass-delete shapes (delete pod x is allowed by default); this closes every delete verb.
  - name: kubectl-node-shell
    pattern: '\bkubectl\b[^;&|\n]*?\bnode-shell\b'
    severity: high
    description: kubectl node-shell opens a root shell on a cluster node
    explanation: No built-in pack gates node-shell; it runs arbitrary commands on the node host, outside the pod sandbox.
  - name: openshift-delete
    pattern: '\boc\b[^;&|\n]*?\bdelete\b'
    severity: critical
    description: oc delete removes cluster resources
    explanation: Mirrors kubectl-delete for the oc CLI (same triage family).
  - name: k3d-cluster-delete
    pattern: '\bk3d\b[^;&|\n]*?\bdelete\b'
    severity: critical
    description: k3d delete tears down a cluster or registry
    explanation: k3d has no built-in pack; cluster delete drops the cluster, its node containers, and their volumes.
  - name: helm-destructive
    pattern: '\bhelm\b[^;&|\n]*?\b(?:uninstall|delete|rollback)\b'
    severity: high
    description: helm uninstall/delete/rollback changes releases
    explanation: Belt-and-suspenders for the helm delete/uninstall triage family.
