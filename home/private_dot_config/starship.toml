"$schema" = "https://starship.rs/config-schema.json"
add_newline = true
format = "${env_var.AGENT_SANDBOX}$container${env_var.WSL_DISTRO_NAME}$username$hostname$os$directory$git_branch$git_status$status$cmd_duration$jobs$nodejs$python$golang$rust$java$line_break$character"
palette = "catppuccin_mocha"

[aws]
disabled = true

[character]
error_symbol = "[❯](bold red)"
success_symbol = "[❯](bold mauve)"

[cmd_duration]
format = "[$duration]($style) "
min_time = 3000
style = "yellow"

[container]
format = '[\[container\]]($style) '
style = "bold teal"

[directory]
fish_style_pwd_dir_length = 1
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold blue"
truncate_to_repo = false

[env_var.AGENT_SANDBOX]
format = '[\[sandbox\]]($style) '
style = "bold peach"

[env_var.WSL_DISTRO_NAME]
format = '[\[wsl\]]($style) '
style = "bold sky"

[gcloud]
disabled = true

[git_branch]
format = "[$symbol$branch]($style) "
style = "green"
symbol = " "

[git_status]
ahead = "⇡$count"
behind = "⇣$count"
conflicted = "=$count"
deleted = "-$count"
diverged = "⇡$ahead_count⇣$behind_count"
format = "([$all_status$ahead_behind]($style) )"
modified = "!$count"
renamed = "»$count"
staged = "+$count"
stashed = "*$count"
style = "yellow"
untracked = "?$count"

[golang]
symbol = " "

[java]
symbol = " "

[jobs]
format = "[$symbol$number]($style) "
style = "blue"
symbol = " "
threshold = 1

[nodejs]
symbol = " "

[os]
disabled = false
format = "[$symbol]($style) "
style = "subtext1"

[os.symbols]
Arch = "󰣇"
Fedora = ""
Linux = ""
Macos = ""
Ubuntu = ""

[palettes.catppuccin_mocha]
base = "#1e1e2e"
blue = "#89b4fa"
crust = "#11111b"
flamingo = "#f2cdcd"
green = "#a6e3a1"
lavender = "#b4befe"
mantle = "#181825"
maroon = "#eba0ac"
mauve = "#cba6f7"
overlay0 = "#6c7086"
overlay1 = "#7f849c"
overlay2 = "#9399b2"
peach = "#fab387"
pink = "#f5c2e7"
red = "#f38ba8"
rosewater = "#f5e0dc"
sapphire = "#74c7ec"
sky = "#89dceb"
subtext0 = "#a6adc8"
subtext1 = "#bac2de"
surface0 = "#313244"
surface1 = "#45475a"
surface2 = "#585b70"
teal = "#94e2d5"
text = "#cdd6f4"
yellow = "#f9e2af"

[python]
symbol = " "

[rust]
symbol = "󱘗 "

[status]
disabled = false
format = "[$symbol$status]($style) "
style = "bold red"
symbol = " "
